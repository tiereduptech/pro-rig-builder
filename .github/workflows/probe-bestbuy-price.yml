name: Best Buy price truth probe (read-only)

# DISPATCH-ONLY, READ-ONLY. No schedule, no writes, no commits, no push.
#
# Answers one question before anyone touches a cron: is `deals.bestbuy.price`
# the number a customer actually pays?
#
# It prints three columns per row — stored / API salePrice / live selling price
# — and classifies each row FIELD-WRONG, STALE-ONLY or AGREE. The distinction
# decides the fix:
#
#   FIELD-WRONG dominant -> the defect is the field we read (same class as the
#                           Amazon 3P bug). A refresh job would refresh a wrong
#                           number on schedule and make it harder to spot,
#                           because the timestamps would look healthy.
#   STALE-ONLY  dominant -> the field is right, the data is just old. Build the
#                           refresh job.
#
# Background: Best Buy prices have not moved since the 2026-04-20 integration.
# Over 2026-05-19..08-17 the price-history recorder logged exactly 1 Best Buy
# price change across 1,569 series, against 13,315 for Amazon — and that
# recorder is 64-for-64 green, so the flat line is real data, not a broken
# instrument. No Best Buy refresh workflow has ever existed.
#
# THE TWO ARMS OF COLUMN 3, AND WHAT EACH CAN SETTLE
# `sellers: false` runs step 1 only — merchant/google/products — which answers
# "what products match this keyword", one row per listing and, in DataForSEO's
# own words, "without per-seller breakdowns". It resolves only when Best Buy
# happens to surface directly in the top `depth` results for a verbose catalog
# product name, which is close to chance. It is the cheap look, and a run of
# UNRESOLVED from it is expected, not a regression.
#
# The 2026-08-17 run that came back 20/20 UNRESOLVED was structurally incapable
# of resolving: it matched on `item.url`, a field the products endpoint does not
# return, and never queried sellers at all. The parsing defects are fixed, so
# products-only now has a real chance where it previously had none — but only
# `sellers: true` (merchant/google/sellers, keyed by product_id) can actually
# answer "what does Best Buy charge for this product".
#
# EVERY RUN BEFORE 2026-08-18 DIED ON THE ENDPOINT, NOT ON THE DATA
# Runs 32153401588 and 32168477366 both came back all-UNRESOLVED with `no
# shopping results for keyword (task 40402 Invalid Path.; tasks_error 1)`.
# 40402 means the URL does not exist: step 1 was posted to
# `merchant/google/products/live/advanced`, and DataForSEO's Google Shopping
# endpoints are task-based without exception — no live variant for products,
# sellers, product_info or reviews. (Merchant Amazon does have live/advanced,
# which is where the wrong path came from.) The call never ran, so none of
# those runs is evidence about the keyword, the seller matching, or the sellers
# arm. Both steps are now task_post + poll task_get.
#
# SELLERS IS DOWNSTREAM OF STEP 1, SO IT CANNOT RESCUE AN EMPTY STEP 1
# Run 32153401588 (5 rows, sellers off) returned 5/5 UNRESOLVED with `no
# shopping results for keyword` on every row. That error returns from
# bestbuy-live-price.mjs before the `useSellers` branch: sellers needs a
# product_id, and a product_id only exists if step 1 returned items. Turning
# `sellers: true` on for those same rows would not have moved one of them.
# Read the row notes to tell the two failures apart — `no shopping results for
# keyword` is step 1 finding nothing, `no bestbuy offer in shopping results` is
# step 1 working and sellers being the missing arm. Only the second is an
# argument for paying for step 2.
#
# The keyword is what step 1 lives or dies on. It used to be the catalog name,
# part number and all ("HyperX HHSS1C-KB-WT/G Cloud Stinger Core – W"), which
# Google Shopping indexes nothing under. It is now the Developer API's own name
# for the sku, which column 2 has already fetched by then; rows that fall back
# to the catalog name (sku 404, API error) are flagged KW-FALLBACK, and every
# UNRESOLVED row prints the exact string it searched on.
#
# bestbuy-price.js records a live test from 2026-06-28: for sku 6519477 the
# Developer API returned salePrice 399.99 (onSale:false) and the Impact catalog
# returned CurrentPrice 399.99, while the real selling price was 239.99. That
# is why the third column exists.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows to probe (max 200 — each row waits on a queued DataForSEO task, up to ~2 min per step)"
        type: string
        default: "20"
      sample:
        description: "Which rows to pick"
        type: choice
        default: "under"
        options:
          - under   # Best Buy is the cheapest deal — it wins our buy box, so a wrong number is what a customer clicks
          - over    # Best Buy is above every peer — the comp-value signature
          - random  # deterministic spread across the catalog
      category:
        description: "Restrict to one category (blank = all), e.g. gpu, storage, motherboard"
        type: string
        default: ""
      sellers:
        description: "Run the DataForSEO sellers step (step 2). Off is the cheap path: products-only, resolves ONLY when Best Buy surfaces directly in Google Shopping."
        type: boolean
        default: true
      live:
        description: "How to source the live selling price (column 3)"
        type: choice
        default: "auto"
        options:
          - auto        # try the product page, fall back to DataForSEO
          - page        # product page only
          - dataforseo  # DataForSEO Google Shopping only
          - off         # skip column 3 (stored vs salePrice only)

# NO concurrency group on purpose. This job writes nothing and pushes nothing,
# so it must not join `main-writer` — that group is what has silently cancelled
# 55 of the last 64 SFTP Ingest runs. A read-only probe should never queue
# behind a writer, and should never be cancelled by one.

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Each row waits on queued DataForSEO tasks — up to ~2 min per step, ~4 min
    # with sellers on. This has to cover limit × that; a 20-row run with sellers
    # on fills it. See the budget note in bestbuy-live-price.mjs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci` — the probe uses only Node builtins and global fetch.

      - name: Probe Best Buy prices
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          ARGS="--limit=${{ inputs.limit }} --sample=${{ inputs.sample }} --live=${{ inputs.live }}"
          if [ -n "${{ inputs.category }}" ]; then ARGS="$ARGS --category=${{ inputs.category }}"; fi
          # Both steps are task_post + poll; step 2 is a second task per row on
          # top of step 1. Turning it off is the cheaper first look — but see
          # the note above on what products-only can and cannot answer.
          if [ "${{ inputs.sellers }}" != "true" ]; then ARGS="$ARGS --no-sellers"; fi
          echo "Running: node probe-bestbuy-price-truth.mjs $ARGS"
          node probe-bestbuy-price-truth.mjs $ARGS

      # Proof, not assertion: fail the job if the probe somehow dirtied the
      # working tree. Read-only should be verifiable, not just claimed.
      - name: Assert nothing was written
        if: always()
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "::error::probe modified the working tree — it must be read-only"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean — probe wrote nothing."
