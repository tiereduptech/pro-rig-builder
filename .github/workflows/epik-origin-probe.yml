name: Epik origin probe (bot-protection layer + crawler gate)

# =============================================================================
#  A one-shot, on-demand probe that runs from a GitHub runner — the same
#  datacenter-IP vantage the watchdog reads from — and answers TWO questions
#  about Epik's shared-hosting bot protection (the wsidchk "request is being
#  verified" interstitial):
#
#  1. CRAWLER GATE (hard gate on DNS cutover). Does the challenge hit Googlebot
#     and Bingbot on real content pages? If a search crawler is served the
#     interstitial instead of a product page, that is the noindex disaster in a
#     new form — 5,500+ pages de-ranked. So we request a product page (and a
#     category and the homepage) with Googlebot's, Bingbot's, a browser's and
#     curl's User-Agent, pinned to the origin, and compare.
#
#       PASS (proven) : curl is challenged in the SAME run where Googlebot and
#                       Bingbot get content -> the exemption is UA-based, so real
#                       Googlebot passes too. Gate clear on the crawler question.
#       FAIL          : a crawler UA is challenged. DNS MUST NOT MOVE. (Caveat: a
#                       runner sending Googlebot's UA is a SPOOFER; a bot tool that
#                       verifies crawlers by reverse-DNS would challenge the spoofer
#                       yet pass real Googlebot — so a FAIL here does not PROVE real
#                       Googlebot is harmed, but it means the gate cannot be cleared
#                       from a runner. Only Epik confirming they exempt VERIFIED
#                       crawlers clears it.)
#       INCONCLUSIVE  : the challenge did not fire this run. Neither proven nor
#                       disproven — let an auto-fired run (below) land, or re-run.
#
#  2. LAYER (for the exemption ask, DESIGN §8.4 option 1). WHERE does the
#     challenge live — edge/pre-.htaccess (even a static file is challenged),
#     handler/path-scoped, or UA-heuristic? That decides how it can be exempted.
#
#  Read-only: it only GETs the origin's own pages, pinned to EPIK_ORIGIN_IP
#  exactly as the watchdog pins, so it measures the BOX, not pre-cutover DNS.
#
#  The challenge is intermittent, so a hand-dispatched probe usually arrives after
#  it has cleared. epik-watchdog.yml therefore dispatches this workflow
#  AUTOMATICALLY the moment it sees a `blocked` verdict — that run arrives while
#  the challenge is still up, which is the only time the PASS/FAIL observation is
#  actually available. You can still dispatch it by hand.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Which origin to probe'
        type: choice
        options: [production, staging]
        default: production
      origin_ip:
        description: 'Override the pinned origin IP (blank = use the EPIK_ORIGIN_IP repo variable)'
        default: ''

permissions: {}

concurrency:
  group: epik-origin-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the origin — crawler gate and challenge layer
        env:
          SITE: ${{ github.event.inputs.site == 'staging' && vars.EPIK_STAGING_URL || 'https://prorigbuilder.com' }}
          AUTH: ${{ github.event.inputs.site == 'staging' && secrets.EPIK_STAGING_BASIC_AUTH || '' }}
          ORIGIN_IP: ${{ github.event.inputs.origin_ip != '' && github.event.inputs.origin_ip || (github.event.inputs.site == 'production' && vars.EPIK_ORIGIN_IP || '') }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          HOST=${SITE#*://}; HOST=${HOST%%/*}; HOST=${HOST%%:*}

          BASE=(-sS --max-time 20 -D /tmp/hdr -o /tmp/body -w '%{http_code}')
          [ -n "$AUTH" ] && BASE+=(-u "$AUTH")
          if [ -n "$ORIGIN_IP" ]; then
            BASE+=(--resolve "$HOST:443:$ORIGIN_IP" -k)
            PIN="pinned: $HOST:443 -> $ORIGIN_IP (cert not validated)"
          else
            PIN="following DNS for $HOST"
            echo "::warning::EPIK_ORIGIN_IP is unset and no override was given — this follows DNS, which pre-cutover answers from RAILWAY, not the box. Neither verdict will describe the box's origin. Set the repo variable or pass the origin_ip input."
          fi
          echo "probing $SITE — $PIN"

          # Four User-Agents. curl = the honest datacenter client the watchdog uses;
          # browser = a current desktop Chrome; then the two crawlers whose fate is
          # the gate. If a crawler UA is served content where curl is challenged, the
          # exemption is UA-based; if a crawler UA is itself challenged, the gate fails.
          UAS=(curl browser googlebot bingbot)
          declare -A UA
          UA[curl]="epik-origin-probe/1.0 (+github-actions; read-only origin probe)"
          UA[browser]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          UA[googlebot]="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          UA[bingbot]="Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)"

          # path | kind | description.  kind=content -> a real SEO page, feeds the
          # CRAWLER GATE. kind=layer -> feeds the layer verdict. gone.html is PURE
          # STATIC (no PHP/rewrite); the product page is 1 of 5,516 crawled URLs.
          PATHS=(
            "/parts/cpu/amd-ryzen-9-9950x-10001|content|product page (1 of 5,516 crawled)"
            "/parts/cpu|content|category page"
            "/|content|homepage"
            "/_deploy-status.json|layer|static JSON — the watchdog's read"
            "/_env.php|layer|PHP handler"
            "/gone.html|layer|pure static file (no PHP, no rewrite)"
            "/__probe-nonexistent-$RUN_ID|layer|unknown path — .htaccess rewrite then resolver"
          )

          EVID=0
          probe() {  # $1=path  $2=ua-string  -> echoes CHALLENGE | ok:<code>
            local code
            code=$(curl "${BASE[@]}" -A "$2" "$SITE$1?cb=$RUN_ID.$RANDOM" 2>/dev/null || echo 000)
            if grep -qiE 'wsidchk|request is being verified' /tmp/body 2>/dev/null; then
              if [ "$EVID" = 0 ]; then cp /tmp/hdr /tmp/evid.hdr 2>/dev/null || true; cp /tmp/body /tmp/evid.body 2>/dev/null || true; EVID=1; fi
              printf 'CHALLENGE'
            else
              printf 'ok:%s' "$code"
            fi
          }

          declare -A R
          for entry in "${PATHS[@]}"; do
            p=${entry%%|*}
            for u in "${UAS[@]}"; do R["$p|$u"]=$(probe "$p" "${UA[$u]}"); done
          done

          ch() { [ "$1" = CHALLENGE ]; }

          # ── results table ────────────────────────────────────────────────────
          {
            echo "## Epik origin probe — $SITE"
            echo ""
            echo "$PIN"
            echo ""
            echo "| path | kind | curl | browser | googlebot | bingbot |"
            echo "|---|---|---|---|---|---|"
            for entry in "${PATHS[@]}"; do
              p=${entry%%|*}; rest=${entry#*|}; kind=${rest%%|*}; desc=${rest#*|}
              echo "| \`$p\` <br>_${desc}_ | $kind | ${R[$p|curl]} | ${R[$p|browser]} | ${R[$p|googlebot]} | ${R[$p|bingbot]} |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # ── CRAWLER GATE ─────────────────────────────────────────────────────
          crawler_challenged=0   # a crawler UA challenged on a content page
          proof_exempt=0         # curl challenged AND both crawlers got content, same page
          any_challenge=0        # the challenge fired at all this run
          for entry in "${PATHS[@]}"; do
            p=${entry%%|*}; rest=${entry#*|}; kind=${rest%%|*}
            for u in "${UAS[@]}"; do ch "${R[$p|$u]}" && any_challenge=1; done
            [ "$kind" = content ] || continue
            { ch "${R[$p|googlebot]}" || ch "${R[$p|bingbot]}"; } && crawler_challenged=1
            if ch "${R[$p|curl]}" && ! ch "${R[$p|googlebot]}" && ! ch "${R[$p|bingbot]}"; then proof_exempt=1; fi
          done

          if [ "$crawler_challenged" = 1 ]; then
            GATE="FAIL"
            GATE_MSG="A crawler User-Agent was served the interstitial on a content page. **DNS MUST NOT MOVE.** Served the challenge instead of the page, Googlebot/Bingbot would de-index those URLs — the noindex disaster in a new form. Caveat: this runner sends a SPOOFED crawler UA, so if Epik's bot tool verifies crawlers by reverse-DNS it would challenge this spoofer yet pass REAL Googlebot; that does not clear the gate from here. Do not cut over until Epik confirms IN WRITING that they exempt VERIFIED search-engine crawlers (Googlebot/Bingbot by reverse-DNS)."
          elif [ "$proof_exempt" = 1 ]; then
            GATE="PASS (proven)"
            GATE_MSG="In this run curl was challenged while Googlebot AND Bingbot were served content on the same page — so the exemption is UA-based, and real Googlebot passes too. The crawler gate is clear. (Security note: a UA-only exemption is trivially spoofable; fine for SEO, worth knowing.)"
          elif [ "$any_challenge" = 1 ]; then
            GATE="LIKELY PASS"
            GATE_MSG="The challenge fired this run but not on any content page under a crawler UA, and curl was not challenged on a page where a crawler got content, so there is no clean proof. Crawlers were not seen challenged — re-run, ideally via an auto-fired run during a live block, to convert this to PASS (proven)."
          else
            GATE="INCONCLUSIVE"
            GATE_MSG="The challenge did not fire at all this run, so the crawler question is neither proven nor disproven. The watchdog auto-dispatches this probe on a \`blocked\` verdict — that is exactly when the PASS/FAIL observation is available. Let one of those runs land, or re-run under load, before treating the gate as clear."
          fi

          # ── LAYER (for the exemption ask) ────────────────────────────────────
          static_ch=0; ch "${R[/gone.html|curl]}" && static_ch=1
          json_ch=0;   ch "${R[/_deploy-status.json|curl]}" && json_ch=1
          php_ch=0;    ch "${R[/_env.php|curl]}" && php_ch=1
          ua_dodge=0
          for entry in "${PATHS[@]}"; do p=${entry%%|*}; if ch "${R[$p|curl]}" && ! ch "${R[$p|browser]}"; then ua_dodge=1; fi; done
          if [ "$any_challenge" = 0 ]; then
            LAYER="NOT REPRODUCED — nothing challenged this run (re-run, or wait for an auto-fired run during a live block)."
          elif [ "$ua_dodge" = 1 ] && [ "$static_ch" = 0 ]; then
            LAYER="UA-HEURISTIC — curl challenged where a browser passes. Fix: send a browser UA, or ask Epik for a UA/path allow. No .htaccess needed."
          elif [ "$static_ch" = 1 ]; then
            LAYER="EDGE / PRE-.HTACCESS — even a pure static file is challenged. .htaccess cannot reach it; the exemption must be set in Epik's bot-protection control (per-path or runner allow)."
          elif [ "$json_ch" = 1 ] || [ "$php_ch" = 1 ]; then
            LAYER="HANDLER / PATH-SCOPED — static passes, JSON/PHP challenged. A per-path exclusion is likely to work (.htaccess/app first, else the bot tool)."
          else
            LAYER="MIXED — a challenge appeared but not on the layer paths. Read the table; re-run under load."
          fi

          {
            echo "### Crawler gate (hard gate on DNS cutover): $GATE"
            echo ""
            echo "$GATE_MSG"
            echo ""
            echo "### Challenge layer: $LAYER"
            echo ""
            if [ -s /tmp/evid.body ]; then
              srv=$(grep -i '^server:' /tmp/evid.hdr 2>/dev/null | head -1 | tr -d '\r' || true)
              echo "**Evidence — first challenged response**"
              echo ""
              echo '```'
              [ -n "$srv" ] && echo "$srv"
              head -c 400 /tmp/evid.body 2>/dev/null | tr -d '\r' | tr '\n' ' '
              echo ""
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "CRAWLER GATE: $GATE"
          echo "$GATE_MSG"
          echo ""
          echo "LAYER: $LAYER"
          echo "(full table in the run summary)"

          # A FAIL is a hard gate — make the run itself red so it cannot be missed.
          if [ "$GATE" = "FAIL" ]; then
            echo "::error::CRAWLER GATE FAILED — a crawler UA was served the bot interstitial. DNS cutover is blocked until Epik exempts verified crawlers. See the run summary."
            exit 1
          fi
