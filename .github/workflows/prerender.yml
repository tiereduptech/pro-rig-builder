name: Prerender SEO pages

on:
  # Nightly at 06:00 UTC (01:00 CT). Adjust if you want a different time.
  schedule:
    - cron: '0 6 * * *'
  # Also run when the catalog changes on main (manual product edits + the daily
  # ingest and refresh commits).
  #
  # ── WHY parts/** AND NOT JUST parts.js ──────────────────────────────────────
  # This trigger listed only 'src/data/parts.js' and had therefore fired ZERO
  # times in the 14 days to 2026-08-28, while src/data/parts/ changed in 59
  # commits over the same window.
  #
  # The path was correct when it was written and stopped being correct at the
  # split (scripts/split-parts-by-cat.cjs). parts.js is now an auto-generated
  # BARREL of per-category imports, and every writer goes through
  # scripts/write-catalog.cjs, which writes the literal, re-splits into
  # parts/<cat>.js, and regenerates the barrel — byte-identical unless a
  # CATEGORY is added or removed. So the one file being watched is the one file
  # a price change cannot touch. Every price fix has been waiting for the 06:00
  # cron, silently, since the split.
  #
  # ── AND WHY THE INTERVAL GUARD BELOW IS PART OF THE SAME FIX ────────────────
  # Turning this path on without one would be a regression, not a fix. The
  # catalog changes ~4.2x/day in bursts (bestbuy 02:00, verify tiers 08/09/10/11
  # and again 19-21, sftp 12:30), each run here costs ~50 min, and this workflow
  # holds `main-writer`. GitHub keeps ONE running plus ONE pending run per
  # concurrency group: a third arrival cancels the pending one. So a burst of
  # hourly verify tiers behind a 50-minute prerender would start cancelling
  # verify tiers — grey, unnotified, and the exact failure that let 55 of 64
  # SFTP runs disappear. See the guard step in the job below.
  push:
    branches: [main]
    paths:
      - 'src/data/parts.js'
      - 'src/data/parts/**'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# SHARED WITH EVERY WORKFLOW THAT PUSHES TO main — seven of them. Before this
# group, only the cron schedule kept them apart, which is luck, not a guard.
# test/verify-main-writer-lock.cjs enforces that the set stays complete.
# cancel-in-progress:false — never kill a prerender midway; make the next one wait.
concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit dist/ back to main

jobs:
  # A cheap job so the expensive one can be skipped WITHOUT holding `main-writer`
  # for 50 minutes. Splitting it out rather than putting `if:` on nine steps: a
  # step-level guard still checks out the repo and still occupies the lock for
  # the life of the job, which is most of what we are trying not to spend.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Reads this workflow's own run history. contents:read is not strictly
      # required for the Actions API but keeps `gh` from 403-ing on a private
      # repo; deliberately NOT contents:write — this job must never be able to
      # push, which is half the reason it is separate from the one that does.
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      # ── Burst guard ─────────────────────────────────────────────────────────
      # Only for PUSH events. The nightly cron and a manual dispatch always run:
      # the cron is the floor that guarantees the site is never more than a day
      # behind, and a human clicking Run wants it run.
      #
      # A push-triggered prerender is SKIPPED when a successful prerender
      # finished less than MIN_PUSH_INTERVAL_HOURS ago, because its output would
      # be nearly identical and its real cost is 50 minutes of the `main-writer`
      # lock taken from the writers queued behind it.
      #
      # 4 hours is chosen against the observed shape of the commits, not picked
      # round: the bursts are the four verify tiers an hour apart (08-11 and
      # 19-21). A 4h window collapses each burst to one render while still
      # letting the 02:00 refreshes, the 12:30 ingest and the evening tiers each
      # get their own. Worst case 6 runs/day, typical 3-4 — against a floor of 1
      # today, and a worst case of ~9 with no guard at all.
      #
      # Net effect: a price fix reaches the static pages within ~4h instead of
      # waiting up to 24h for the nightly.
      - name: Skip if a prerender ran recently (push events only)
        id: guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_PUSH_INTERVAL_HOURS: '4'
        run: |
          set -euo pipefail
          LAST=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/prerender.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty' || true)
          if [ -z "$LAST" ]; then
            echo "No successful prerender on record — running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
          echo "Last successful prerender: $LAST (${AGE} min ago), window $(( MIN_PUSH_INTERVAL_HOURS * 60 )) min."
          if [ "$AGE" -lt "$(( MIN_PUSH_INTERVAL_HOURS * 60 ))" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — a prerender completed ${AGE} min ago. The 06:00 cron is the floor; the next push after the window will render."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  prerender:
    needs: guard
    # A push inside the window is skipped here. The cron and workflow_dispatch
    # set no skip output at all, so the comparison is false and they always run.
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Use a token that can push back. GITHUB_TOKEN works for push-to-same-repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vite build (produces dist/assets bundles)
        run: npm run build -- --skip-prerender || npx vite build
        # The "|| npx vite build" fallback runs raw vite if the npm script
        # doesn't accept --skip-prerender. Either way we just need the assets.
        #
        # ── VITE_DATA_BASE: this is the ONLY place it can be set ─────────────
        # It is compile-time inlined into the bundle (src/App.jsx routes the
        # price-history/ and reviews/ fetches through it), and this job is the
        # only one that builds the bundle. The deploy workflows ship the
        # COMMITTED dist/ and cannot change it: the ~5.5k prerendered HTML files
        # reference dist/assets/*.js by content hash, so a rebuild anywhere
        # downstream emits hashes none of them point at.
        #
        # Sourced from the repo variable and therefore INERT until that variable
        # is set — unset yields '', which is what src/App.jsx already defaults
        # to, so the bundle stays byte-for-byte same-origin. Setting the variable
        # is the deliberate flip, in the same shape as EPIK_PROD_AUTO_DEPLOY and
        # CF_PAGES_AUTO_DEPLOY.
        #
        # Two things to know before setting it, because this job commits dist/
        # to main and Railway (live production today) and Epik both serve that
        # same dist/ — the blast radius is not limited to Cloudflare Pages:
        #
        #   1. The flip reaches live production on the NEXT nightly run, without
        #      anyone choosing to deploy. So set it only once a staging Pages
        #      deploy has confirmed R2 actually serves these files to a browser.
        #   2. Rollback is slow. The bad bundle would be COMMITTED in dist/, so
        #      clearing the variable does not fix it — it takes another full
        #      prerender run (45 min, or a manual dispatch of this workflow) to
        #      rebuild. There is no redeploy that undoes it.
        #
        # See deploy/DESIGN-cloudflare-pages.md §10.
        env:
          VITE_DATA_BASE: ${{ vars.VITE_DATA_BASE }}

      # Gate the artifact that actually ships. tests.yml runs this same
      # assertion on its own throwaway build to catch a regression at PR time;
      # this run is the one that stands between a tree-shaken UI and
      # production, because this job commits dist/ to main and both Railway and
      # Epik serve that same dist/.
      #
      # Failing here costs a nightly prerender. Not failing here costs a
      # silently missing price disclosure on every product page until someone
      # reads one — which is how #73's UNCONFIRMED tag was absent from the
      # shipped bundle while its logic ran correctly underneath.
      - name: Assert badge markup survived the build
        run: node scripts/assert-bundle-markers.cjs --dir dist/assets

      - name: Count indexable products
        id: count
        run: |
          TOTAL=$(node -e "
            (async () => {
              const { isIndexable, loadParts, productPath } = require('./scripts/url-slugs.cjs');
              const parts = (await loadParts()).filter(isIndexable);
              const routes = parts.map(p => productPath(p)).filter(Boolean);
              process.stdout.write(String(routes.length));
            })();
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total indexable products: $TOTAL"

      - name: Prerender in batches (fresh node process per batch)
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          BATCH_SIZE: 40
          CONCURRENCY: 6
        run: |
          set -e
          # Clean stale per-range failure files
          rm -f prerender-failures-*.json

          BATCH_NUM=0
          ANY_FAILURES=0

          for ((START=0; START<TOTAL; START+=BATCH_SIZE)); do
            END=$((START + BATCH_SIZE))
            if [ $END -gt $TOTAL ]; then END=$TOTAL; fi
            BATCH_NUM=$((BATCH_NUM + 1))

            echo ""
            echo "=== Batch $BATCH_NUM : products [$START, $END) of $TOTAL ==="

            # Fresh node process per batch — OS reclaims any leaked Chrome state on exit.
            if ! node prerender.cjs --start=$START --end=$END --concurrency=$CONCURRENCY --no-static --incremental; then
              ANY_FAILURES=1
              echo "  ! Batch $BATCH_NUM had failures (continuing)"
            fi
          done

          echo ""
          echo "=== Writing sitemap ==="
          node prerender.cjs --sitemap-only

          # Aggregate per-range failure files
          if ls prerender-failures-*.json >/dev/null 2>&1; then
            node -e "
              const fs = require('fs');
              const files = fs.readdirSync('.').filter(f => f.match(/^prerender-failures-.*\.json\$/));
              const all = files.flatMap(f => JSON.parse(fs.readFileSync(f, 'utf8')));
              fs.writeFileSync('prerender-failures.json', JSON.stringify(all, null, 2));
              console.log('Aggregated ' + all.length + ' failures');
            "
          fi

          if [ $ANY_FAILURES -eq 1 ]; then
            echo "::warning::Some pages failed to prerender. See prerender-failures.json artifact."
          fi

      - name: Upload failures artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-failures
          path: prerender-failures.json
          if-no-files-found: ignore
          retention-days: 14

      # HARD GATE — must pass before we commit. The batched prerender above
      # tolerates individual batch exit codes (for timeouts), so an output
      # regression would otherwise slip through as a warning. This step is NOT
      # tolerant: a non-zero exit fails the job and blocks the commit below, so
      # a contaminated dist can never ship silently again. Asserts the OUTPUT
      # (robots, single head tags, self-referencing canonical, product body,
      # no shell/error leak) — see the 2026-07-27 GONE_SHELL noindex incident,
      # which shipped because the 410 input layer was verified but the output
      # was not.
      - name: Verify prerender output (robots, head tags, canonical, no shell)
        run: node verify-prerender.cjs

      - name: Commit and push if dist/ changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/ public/sitemap.xml

          if git diff --staged --quiet; then
            echo "No changes to commit. Catalog unchanged since last prerender."
            exit 0
          fi

          # Count what changed for the commit message
          CHANGED=$(git diff --staged --name-only | wc -l)

          git commit -m "chore(seo): nightly prerender [skip ci]

          Regenerated $CHANGED files via .github/workflows/prerender.yml
          Triggered by: ${{ github.event_name }}"

          # Reconcile with whatever landed while we were prerendering.
          #
          # NO `-X ours`. Measured 2026-08-12 on a scratch repo, because the
          # direction is counter-intuitive and was recorded backwards:
          #
          #   In a REBASE, "ours" is the UPSTREAM being replayed onto — so
          #   `pull --rebase -X ours` silently discarded THIS RUN's version of
          #   every conflicting file and kept the other writer's. Non-conflicting
          #   files still took our version. Net result: main got a dist mixed
          #   from two different source trees, and the job exited 0 with no
          #   warning. (The `git pull -X ours` fallback on the next line is a
          #   MERGE, where "ours" means the opposite — the local branch. Same
          #   flag, inverted meaning, one line apart.)
          #
          # A half-and-half dist is worse than either side winning cleanly, and
          # no automatic rule can pick correctly here. The main-writer
          # concurrency group now keeps the other workflows out; a conflict that
          # survives that means a human pushed dist mid-run, and a human is who
          # should resolve it. So: fail, loudly, with the tally.
          # Rebase onto FETCH_HEAD, not origin/main: actions/checkout does a
          # shallow single-branch fetch, so the remote-tracking ref is not
          # guaranteed to exist. FETCH_HEAD always is. The count is diagnostic
          # only — never let it fail the job.
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo '?')
          echo "origin/main moved $BEHIND commit(s) since this run checked out."

          PUSHED=0
          for attempt in 1 2 3; do
            if ! git rebase FETCH_HEAD; then
              CONFLICTED=$(git diff --name-only --diff-filter=U)
              N=$(printf '%s\n' "$CONFLICTED" | grep -c . || true)
              echo "::error::Prerender rebase hit $N conflicted path(s) against origin/main (which moved $BEHIND commit(s)). Not guessing a winner — resolve by hand."
              echo "--- conflicted paths (showing up to 40 of $N) ---"
              printf '%s\n' "$CONFLICTED" | head -40
              git rebase --abort
              exit 1
            fi

            if git push origin main; then
              PUSHED=1
              echo "Pushed prerender update on attempt $attempt — Railway will redeploy automatically."
              break
            fi

            echo "Push rejected on attempt $attempt — origin/main moved between rebase and push. Refetching."
            git fetch origin main
            BEHIND=$(git rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo '?')
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Prerender could not push after 3 attempts — origin/main kept moving. Expected the main-writer lock to prevent this; check for a human or an unlocked workflow pushing to main."
            exit 1
          fi
