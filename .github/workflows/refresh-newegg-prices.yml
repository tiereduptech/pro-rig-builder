name: Refresh Newegg Prices

on:
  # DISABLED 2026-07-20 — searchBySku looks up Newegg item numbers via
  # productsearch/1.0 `keyword=`, which does not index SKUs. Every lookup misses,
  # so the job stamps staleSince and deletes the deal 7 days later. It has a 100%
  # failure rate (0 of 5,428 products carry refreshedAt) and reported "0 updated"
  # on every run since 2026-07-06 — it can only delete, never repair. This fuse
  # already destroyed 1,655 deals on 7/06 (429 of them good first-party N82E
  # listings) and was eating the surviving 62 twice a day.
  # Re-enable ONLY after SKU lookup is fixed and verified against the live feed.
  # schedule:
  #   - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — probe the feed, write nothing, commit nothing"
        type: boolean
        default: true
      limit:
        description: "Only process the first N products (blank = all)"
        type: string
        default: "50"

# Repo-wide lock shared by every workflow that pushes to main. Schedule is
# disabled (see above) but workflow_dispatch still writes parts.js.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh Newegg prices
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
          RAKUTEN_NEWEGG_MID: ${{ secrets.RAKUTEN_NEWEGG_MID }}
        run: |
          echo "REFRESH_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          echo "Running: node refresh-newegg-prices.cjs$ARGS"
          node refresh-newegg-prices.cjs $ARGS

      # This job had no outcome assertion at all. The commit step below reads
      # its summary inside `if [ -f newegg-refresh-summary.json ]`, which is the
      # precise shape scripts/assert-outcome.cjs was written to kill: when the
      # summary is absent the body is skipped, the step exits 0, and the job
      # reports SUCCESS having done nothing.
      #
      # `movement.freezeAlarm` is the second half — not "did we run?" but "is
      # Newegg still repricing?". This job reported "0 updated" on every run
      # from 2026-07-06 and kept deleting deals, and nothing was obliged to act
      # on it. A distribution, not a max, because a max reads 0 days as long as
      # any single SKU still moves; see scripts/price-movement.cjs.
      #
      # NOTE: this workflow's cron is still commented out (see the top of the
      # file) and re-enabling it is a separate question with its own blocking
      # bug. These assertions describe what must hold whenever it does run.
      - name: Assert the refresh produced an outcome
        run: |
          node scripts/assert-outcome.cjs \
            --artifact=newegg-refresh-summary.json \
            --label="Newegg refresh" \
            --newer-than-epoch="$REFRESH_STARTED" \
            --require='processed>0' \
            --require='movement.freezeAlarm==0' \
            --warn='movement.movedShare>=0.1' \
            --warn='updated>0'

      # The summary is the whole point of a dry run — keep it even though the
      # commit step below deletes it on real runs.
      - name: Upload refresh summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newegg-refresh-summary
          path: newegg-refresh-summary.json
          if-no-files-found: warn

      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the literal write, before the commit, so parts.js + chunks commit atomically.
      - name: Re-split catalog into per-category chunks
        if: ${{ inputs.dry_run != true }}
        run: node scripts/split-parts-by-cat.cjs

      - name: Commit and push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -f newegg-refresh-summary.json ]; then
            UPDATED=$(node -e "console.log(require('./newegg-refresh-summary.json').updated)")
            REMOVED=$(node -e "console.log(require('./newegg-refresh-summary.json').removed)")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/parts.js src/data/parts/ src/data/price-movement-watch.json
            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -m "chore(newegg): refresh prices — $UPDATED updated, $REMOVED removed"
              git push
            fi
            rm -f newegg-refresh-summary.json
          fi
