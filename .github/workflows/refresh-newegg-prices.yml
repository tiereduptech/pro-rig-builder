name: Refresh Newegg Prices

# =============================================================================
#  ── WHY THE SCHEDULE IS BACK ON ─────────────────────────────────────────────
#  The cron was disabled on 2026-07-20 (ac86be5206b) with this reason:
#
#    "searchBySku looks up Newegg item numbers via productsearch/1.0 `keyword=`,
#     which does not index SKUs. Every lookup misses, so the job stamps
#     staleSince and deletes the deal 7 days later ... it can only delete, never
#     repair. Re-enable ONLY after SKU lookup is fixed and verified against the
#     live feed."
#
#  That condition was met the same day. 058b6959700, committed hours after the
#  disable, replaced searchBySku() with newegg-match.js's searchNewegg() —
#  name + UPC matching, the path ingest already uses successfully — and split
#  outcomes into LOOKUP_FAILED (touches nothing: not the price, not staleSince,
#  not the streak) and CONFIRMED_ABSENT. The schedule was simply never turned
#  back on.
#
#  "Verified against the live feed" is also met. Manual dry run 2026-08-17
#  (run 32051310089), 50 rows:
#
#    Matched OK ....... 38  (repriced 22, unchanged 15, migrated 4, rematched 1)
#    Lookup failed .... 12  (no change written)
#    Feed failure rate  12.0%  (breaker at 20%)
#    Removed ........... 0
#
#  The cost of leaving it off is not theoretical. As of 2026-08-28 Newegg is
#  3,178 priced rows and ZERO of them carry `refreshedAt` — no row has been
#  repriced in 39 days. It is the largest priced retailer after Amazon, and it
#  is in exactly the state deals.msi was in when refresh-msi-prices.yml was
#  written, at twenty times the row count. Its apparent freshness came from
#  sftp-ingest's matchedAt on newly ATTACHED deals, which refreshes nothing
#  already in the catalog — the lie that scripts/assert-retailer-freshness.cjs
#  now reports as a 10d median against a 1d newest.
#
#  ── WHAT IS STILL BLOCKED, AND WHY THAT IS NOT THIS ─────────────────────────
#  REMOVALS_ENABLED = false, hard-coded at refresh-newegg-prices.cjs:107 with
#  three stated conditions that are NOT met. It is deliberately not a CLI flag
#  or workflow input, so no schedule and no dispatch can reach it. That is the
#  gate on the 2026-07-06 incident (1,655 deletions, ~904 of them live), and it
#  stays shut. Its own comment states the resulting posture exactly: "until then
#  this script is a re-pricer that records absence evidence."
#
#  So what this schedule turns back on is repricing. Deletion is unreachable
#  from here, by construction rather than by care.
#
#  ── THE SLOT ────────────────────────────────────────────────────────────────
#  NOT the original '0 6,18 * * *'. 06:00 is prerender's slot, and prerender is
#  in the same `main-writer` concurrency group and runs 45-49 min (measured:
#  06:25->07:10, 16:58->17:47, 17:47->18:36). This job is the second-longest
#  writer in the repo — ~1s/row against the Rakuten feed, so ~53 min over 3,178
#  rows — so the two would have queued nose-to-tail into price-history at 07:00
#  every single night.
#
#    01:00  refresh-bestbuy-prices     ~16 min
#    02:00  refresh-msi-prices         ~1 min
#    03:00  asin-identity-audit        ~10 min
#    04:00  THIS JOB                   ~53 min  (finishes ~04:55)
#    06:00  prerender                  ~49 min
#    07:00  price-history              ~3 min
#    12:00  sftp-ingest                ~52 min
#    16:00  THIS JOB                   ~53 min  (finishes ~16:55)
#    20:00  verify-catalog
#
#  04:00 sits after the ASIN audit and finishes an hour before prerender, so a
#  price this job fixes reaches the static pages the same night rather than
#  waiting a day — the same argument refresh-msi-prices.yml makes for 02:00.
#  16:00 is clear of everything scheduled. Frequency is unchanged from what the
#  CADENCE table already justifies; only the hours moved.
#
#  Note that this job's own commit touches src/data/parts/**, which triggers
#  prerender on its own (behind a 4h burst guard). That is intended and is why
#  the slot leaves prerender's scheduled run room rather than racing it.
# =============================================================================

on:
  schedule:
    - cron: "0 4,16 * * *"   # after the ASIN audit, clear of the 06:00 prerender
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — probe the feed, write nothing, commit nothing"
        type: boolean
        default: true
      limit:
        description: "Only process the first N products (blank = all)"
        type: string
        default: "50"

# Repo-wide lock shared by every workflow that pushes to main. Schedule is
# disabled (see above) but workflow_dispatch still writes parts.js.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh Newegg prices
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
          RAKUTEN_NEWEGG_MID: ${{ secrets.RAKUTEN_NEWEGG_MID }}
        run: |
          echo "REFRESH_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          echo "Running: node refresh-newegg-prices.cjs$ARGS"
          node refresh-newegg-prices.cjs $ARGS

      # This job had no outcome assertion at all. The commit step below reads
      # its summary inside `if [ -f newegg-refresh-summary.json ]`, which is the
      # precise shape scripts/assert-outcome.cjs was written to kill: when the
      # summary is absent the body is skipped, the step exits 0, and the job
      # reports SUCCESS having done nothing.
      #
      # `movement.freezeAlarm` is the second half — not "did we run?" but "is
      # Newegg still repricing?". This job reported "0 updated" on every run
      # from 2026-07-06 and kept deleting deals, and nothing was obliged to act
      # on it. A distribution, not a max, because a max reads 0 days as long as
      # any single SKU still moves; see scripts/price-movement.cjs.
      #
      # NOTE: this workflow's cron is still commented out (see the top of the
      # file) and re-enabling it is a separate question with its own blocking
      # bug. These assertions describe what must hold whenever it does run.
      - name: Assert the refresh produced an outcome
        run: |
          node scripts/assert-outcome.cjs \
            --artifact=newegg-refresh-summary.json \
            --label="Newegg refresh" \
            --newer-than-epoch="$REFRESH_STARTED" \
            --require='processed>0' \
            --require='movement.freezeAlarm==0' \
            --warn='movement.movedShare>=0.1' \
            --warn='updated>0'

      # The summary is the whole point of a dry run — keep it even though the
      # commit step below deletes it on real runs.
      - name: Upload refresh summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newegg-refresh-summary
          path: newegg-refresh-summary.json
          if-no-files-found: warn

      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the literal write, before the commit, so parts.js + chunks commit atomically.
      - name: Re-split catalog into per-category chunks
        if: ${{ inputs.dry_run != true }}
        run: node scripts/split-parts-by-cat.cjs

      - name: Commit and push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -f newegg-refresh-summary.json ]; then
            UPDATED=$(node -e "console.log(require('./newegg-refresh-summary.json').updated)")
            REMOVED=$(node -e "console.log(require('./newegg-refresh-summary.json').removed)")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/parts.js src/data/parts/ src/data/price-movement-watch.json
            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -m "chore(newegg): refresh prices — $UPDATED updated, $REMOVED removed"
              git push
            fi
            rm -f newegg-refresh-summary.json
          fi
