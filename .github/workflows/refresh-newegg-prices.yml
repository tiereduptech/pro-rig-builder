name: Refresh Newegg Prices

on:
  # ── HISTORY ────────────────────────────────────────────────────────────────
  # DISABLED 2026-07-20 — searchBySku looked up Newegg item numbers via
  # productsearch/1.0 `keyword=`, which does not index SKUs. Every lookup missed,
  # so the job stamped staleSince and deleted the deal 7 days later. It had a 100%
  # failure rate (0 of 5,428 products carried refreshedAt) and reported "0 updated"
  # on every run since 2026-07-06 — it could only delete, never repair. That fuse
  # destroyed 1,655 deals on 7/06 (429 of them good first-party N82E listings) and
  # was eating the surviving 62 twice a day.
  #
  # The condition for re-enabling was: SKU lookup fixed AND verified against the
  # live feed. Both are now met.
  #
  # FIXED 2026-07-20 in 058b6959700, hours after the disable: lookups resolve via
  # newegg-match.js searchNewegg() on name/UPC — the same matcher ingest uses —
  # and outcomes split into LOOKUP_FAILED vs CONFIRMED_ABSENT, with deletion
  # reachable only from the latter. The cron simply never got uncommented.
  #
  # VERIFIED 2026-08-17 against the live feed, run 32048509582 (dry run, 50-product
  # stratified sample, 46s):
  #   50 processed · 38 matched · 12 lookup-failed (12%, breaker at 20%)
  #   7 real price changes — median |delta| 6.1%, max 28.0%, 4 drops / 3 rises
  #   only 2 deltas over 10%; extrapolates to ~373 of 2,666 rows, not a mass move
  #   1 SUSPECT_HIGH withheld by the sanity gate (kept $67.10, rejected $82.16)
  #   0 removal candidates, and REMOVALS_ENABLED = false still hard-blocks the
  #     delete path at refresh-newegg-prices.cjs:107/517 regardless
  #
  # So the fuse that caused the 7/06 loss is off at the source, independently of
  # this schedule. Re-enabling here restores re-pricing only.
  #
  # NOTE: the sample was 50 of 2,666 (1.9%). The other 98% is unmeasured; a full
  # dry run (blank limit) is the way to see the whole shape if that matters later.
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — probe the feed, write nothing, commit nothing"
        type: boolean
        default: true
      limit:
        description: "Only process the first N products (blank = all)"
        type: string
        default: "50"

# Repo-wide lock shared by every workflow that pushes to main. The schedule is
# live again (see above), and workflow_dispatch also writes parts.js.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh Newegg prices
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
          RAKUTEN_NEWEGG_MID: ${{ secrets.RAKUTEN_NEWEGG_MID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          echo "Running: node refresh-newegg-prices.cjs$ARGS"
          node refresh-newegg-prices.cjs $ARGS

      # The summary is the whole point of a dry run — keep it even though the
      # commit step below deletes it on real runs.
      - name: Upload refresh summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newegg-refresh-summary
          path: newegg-refresh-summary.json
          if-no-files-found: warn

      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the literal write, before the commit, so parts.js + chunks commit atomically.
      - name: Re-split catalog into per-category chunks
        if: ${{ inputs.dry_run != true }}
        run: node scripts/split-parts-by-cat.cjs

      - name: Commit and push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -f newegg-refresh-summary.json ]; then
            UPDATED=$(node -e "console.log(require('./newegg-refresh-summary.json').updated)")
            REMOVED=$(node -e "console.log(require('./newegg-refresh-summary.json').removed)")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/parts.js src/data/parts/
            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -m "chore(newegg): refresh prices — $UPDATED updated, $REMOVED removed"
              git push
            fi
            rm -f newegg-refresh-summary.json
          fi
