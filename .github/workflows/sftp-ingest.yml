name: SFTP Ingest Newegg Catalog
on:
  schedule:
    # Daily at 12:00 UTC (between morning and evening Newegg price refresh)
    - cron: "0 12 * * *"
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Restore manifest cache
        uses: actions/cache@v4
        with:
          path: catalog-build/sftp-manifest.json
          key: sftp-manifest-${{ github.run_id }}
          restore-keys: |
            sftp-manifest-
      - name: Run SFTP ingestion
        env:
          RAKUTEN_FTP_PASSWORD: ${{ secrets.RAKUTEN_FTP_PASSWORD }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: node sftp-ingest.cjs
      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the literal write, before the commit, so parts.js + chunks commit atomically.
      - name: Re-split catalog into per-category chunks
        run: node scripts/split-parts-by-cat.cjs
      - name: Commit and push if changed
        run: |
          if [ -f catalog-build/sftp-ingest-summary.json ]; then
            UPDATED=$(node -e "console.log(require('./catalog-build/sftp-ingest-summary.json').totals.updated)")
            EXCLUSIVES=$(node -e "console.log(require('./catalog-build/sftp-ingest-summary.json').totals.exclusives)")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Commit parts.js (catalog updates) and exclusives meta (small summary file, not the 500MB jsonl)
            git add src/data/parts.js src/data/parts/ catalog-build/newegg-exclusives.meta.json catalog-build/sftp-manifest.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore(sftp): newegg catalog ingest - $UPDATED updated, $EXCLUSIVES exclusives"
              git push
            fi
          fi
