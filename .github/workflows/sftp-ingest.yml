name: SFTP Ingest Newegg Catalog
on:
  schedule:
    # Daily at 12:00 UTC (between morning and evening Newegg price refresh)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

# Repo-wide lock shared by every workflow that pushes to main. This job's push
# is a naked `git push` with no rebase/retry, so the lock is what keeps it from
# losing a race it cannot recover from.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 180, raised from 60 on 2026-08-17. Sixty could not fit the work: the two
    # Newegg feeds are ~1GB and take ~35 min to pull from aftp.linksynergy.com,
    # leaving ~25 min for a parse of ~6M marketplace records that needs ~20 at
    # the measured 5.2k records/s. Every run landed at the edge, and 88 of 99
    # were cancelled mid-parse at ~3620s while GC-thrashing against the old
    # buffered parser. That parser now streams (peak heap 4MB for 2M records,
    # measured), so the wall is wall-clock rather than memory — this is the
    # budget that clears it.
    #
    # Steady state should be far under this: the manifest cache skips unchanged
    # feeds, so only a cold cache or a genuinely changed feed pays full price.
    # The cache never got the chance to save before, because actions/cache saves
    # in its post step and the job never reached one.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Restore manifest cache
        uses: actions/cache@v4
        with:
          path: catalog-build/sftp-manifest.json
          key: sftp-manifest-${{ github.run_id }}
          restore-keys: |
            sftp-manifest-
      - name: Run SFTP ingestion
        env:
          RAKUTEN_FTP_PASSWORD: ${{ secrets.RAKUTEN_FTP_PASSWORD }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          echo "INGEST_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          node sftp-ingest.cjs

      # ── ESCALATION, ORDERED FIRST ON PURPOSE ─────────────────────────────
      #
      # A held feed makes totals.errors non-zero, so the outcome assertion below
      # fails on night one and would keep failing, from the same step, with the
      # same annotation, for as long as the hold lasts. That is precisely how
      # epik-watchdog.yml's schedule ended up commented out: red so regularly
      # that the red stopped being information. #92 fixed the silence and traded
      # it for a repetition, which is a quieter version of the same problem.
      #
      # This step fails ONLY once a hold has survived HOLD_ESCALATE_AFTER
      # consecutive attempts, and it runs BEFORE the outcome assertion so that
      # it is the step that fails when it fires. The failing step name and the
      # --label are what a human sees in the notification and the run summary,
      # so night two arrives as "did the ingest produce an outcome" and night
      # five arrives as this: a different sentence about a different fact.
      #
      # It cannot fire on a healthy run. totals.escalatedHolds is initialised to
      # 0 in the summary literal, including on the quiet early return.
      - name: Escalate a feed held past the retry threshold
        run: |
          node scripts/assert-outcome.cjs \
            --artifact=catalog-build/sftp-ingest-summary.json \
            --label="SFTP ingest — a feed has been unreadable for days, not minutes" \
            --newer-than-epoch="$INGEST_STARTED" \
            --require='totals.escalatedHolds==0'

      # The INGEST step exiting 0 does not mean it produced anything, and the
      # commit step below cannot tell the difference: with no summary on disk it
      # skips its body and the job goes green having ingested nothing. That is
      # how 99 runs committed once. Assert the outcome here, between the work
      # and the commit, so a dead run is red instead of quiet.
      #
      # errors==0 fails the run: a feed that would not parse is a defect.
      # feedRecords>0 only warns, because the manifest cache legitimately skips
      # unchanged feeds, and a steady-state run that parses nothing is correct.
      - name: Assert the ingest produced an outcome
        run: |
          node scripts/assert-outcome.cjs \
            --artifact=catalog-build/sftp-ingest-summary.json \
            --label="SFTP ingest" \
            --newer-than-epoch="$INGEST_STARTED" \
            --require='totals.errors==0' \
            --warn='totals.feedRecords>0'
      # NO RE-SPLIT STEP. The ingest now writes through scripts/write-catalog.cjs,
      # which re-splits into src/data/parts/<cat>.js, regenerates the barrel and
      # verifies the result (assertBarrelShape) as part of the write itself. A
      # step here would re-run split-parts-by-cat.cjs over an already-split
      # catalog -- harmless, but it would also re-establish the arrangement
      # write-catalog.cjs was built to abolish: the re-split living in YAML,
      # where nothing stops a literal write from being the last thing that
      # happened. That is the 2026-06-27 dual-export corruption.
      - name: Commit and push if changed
        run: |
          # Not `if [ -f ... ]`. A missing summary here means the ingest died
          # after the assertion somehow; either way it is a failure to report,
          # never a branch to skip past on the way to a green check.
          if [ ! -f catalog-build/sftp-ingest-summary.json ]; then
            echo "::error::no ingest summary at commit time — refusing to report success"
            exit 1
          fi
          UPDATED=$(node -e "console.log(require('./catalog-build/sftp-ingest-summary.json').totals.updated)")
          EXCLUSIVES=$(node -e "console.log(require('./catalog-build/sftp-ingest-summary.json').totals.exclusives)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit parts.js (catalog updates) and exclusives meta (small summary file, not the 500MB jsonl)
          git add src/data/parts.js src/data/parts/ catalog-build/newegg-exclusives.meta.json catalog-build/sftp-manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(sftp): newegg catalog ingest - $UPDATED updated, $EXCLUSIVES exclusives"
            # Not a bare `git push`. This job runs for ~an hour, and anyone
            # merging a PR in that window moves main underneath it. Run
            # 32136198527 built "16935 updated, 3171688 exclusives" and then lost
            # the lot to `! [rejected] main -> main (fetch first)`. The
            # main-writer lock serialises workflows against each other; it has no
            # opinion about a person clicking Merge.
            bash scripts/push-with-rebase.sh main
          fi
