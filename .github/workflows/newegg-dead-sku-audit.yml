name: Newegg dead-SKU audit (read-only)

# =============================================================================
#  Answers ONE question across all 2,763 Newegg links (2,666 `newegg`, 60
#  open-box, 37 marketplace): does Newegg still carry this sku, and can it be
#  bought?
#
#  This is the counterpart of bestbuy-dead-sku-audit.yml and it carries more
#  weight: 1,725 of those rows have NO other priced retailer, so whatever this
#  reports is the difference between a link cleanup and a catalog shrink.
#
#  WHY THE FEED, NOT THE SEARCH API
#  refresh-newegg-prices.cjs resolves by name/UPC through Rakuten product
#  search, where a miss is a matcher outcome (`no_results`, `variant_rejected`)
#  and not evidence of absence — the script says so and refuses to delete on it.
#  The product catalog feed is Newegg's own enumeration of what it sells, keyed
#  by the item numbers the catalog already stores, carrying `is_deleted` and
#  `availability` per row.
#
#  TWO STRIKES, AND THE SNAPSHOT RULE
#  A sku missing from one feed pull is `pending`, never `dead`. The second
#  strike must come from a DIFFERENT feed snapshot: this job carries state
#  forward as an artifact and refuses to advance a strike against a
#  byte-identical feed, so dispatching twice in an hour cannot manufacture a
#  confirmation. In practice that means the first dispatch reports unbuyable +
#  pending and zero dead, and the second dispatch AFTER the feed refreshes is
#  the one that can condemn anything.
#
#  UNKNOWN IS NEVER DEAD
#  If a feed fails mid-stream or its TRL trailer disagrees with the parsed
#  record count, every sku that feed could have carried is UNKNOWN and the job
#  goes red. A census with holes in it has not measured the catalog. That is the
#  failure mode of feed-overlap-audit run 31440517417, which streamed the main
#  feed for 11 minutes and then died on a hardcoded MKPL path that does not
#  exist — so this workflow DISCOVERS its feeds instead of assuming them.
#
#  MEMORY
#  The MKPL feed is 886MB gzipped and several million rows; buffering it is what
#  killed the nightly ingest for 95 days. This uses streamTxtFeed() from
#  sftp-ingest.cjs directly — the fixed parser, shared rather than copied, so
#  the audit cannot drift from the ingest or resurrect the OOM. Peak heap is the
#  ~3,400-key target index plus one record.
#
#  PREFLIGHT BEFORE BYTES
#  Run 32057560889 downloaded ~1.3GB over 58 minutes and then died on
#  `streamTxtFeed is not a function` — the export did not exist. Worse, because
#  sftp-ingest.cjs had no `require.main === module` guard, merely requiring it
#  started a SECOND full ingest in the background: a competing SFTP session on an
#  endpoint that throttles concurrent readers (which is most of why one feed took
#  2,973s), and, had it finished, a write to parts.js from a job declared
#  read-only. The audit now proves every cross-module dependency before opening a
#  socket — including streaming a synthetic feed and checking that the columns it
#  reads still land at their spec positions. It costs about 10ms.
#
#  FEED FRESHNESS IS A CORRECTNESS GATE
#  Sightings resolve least-condemning-wins, so a stale feed cannot reveal a death
#  — it can only mask one. The MKPL feed measured mtime 2023-03-16 against mp's
#  2026-08-17 (same listing call, same field, so this is Newegg's timestamp and
#  not a unit bug); a 2023 `in-stock` would override the live feed and keep a
#  dead link on the site. Feeds over 14 days old are excluded at DISCOVERY, before
#  download, and named in the report and job summary. That is also where the
#  runtime went: skipping the 886MB file drops this job from ~58 min to ~10.
#
#  Read-only by construction: contents: read, no commit step, an
#  assert-nothing-written step, and the script writes only under catalog-build/,
#  which .gitignore excludes. Acting on the findings is a separate, deliberate
#  run.
#
#  Dispatch-only: this is a measurement, not a schedule. Add a cron when
#  something downstream depends on the trend.
#
#  Runtime: the main feed measured ~11 min to stream 1,035,311 records, plus a
#  ~4 min download when nothing else is competing for the socket. MKPL is no
#  longer pulled, so the timeout is sized for the mp feed with headroom rather
#  than for 1GB of downloads.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      use_prior_state:
        description: 'Carry the previous run''s strikes forward (uncheck to force a clean first-strike run)'
        required: false
        default: true
        type: boolean
      max_feed_age_days:
        description: 'Ignore any feed older than this many days. The mp feed regenerates daily; MKPL has not since 2023-03-16.'
        required: false
        default: '14'
        type: string
      allow_stale_feeds:
        description: 'Read stale feeds anyway. A stale in-stock row MASKS a death — only tick this to measure what MKPL still contains, never to publish a census.'
        required: false
        default: false
        type: boolean

permissions: {}

# Not the main-writer lock — this workflow never pushes. It serialises only
# against itself so two dispatches cannot fight over the same feed download.
concurrency:
  group: newegg-dead-sku-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read        # read the previous run's state artifact, nothing more
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Seconds, before the SFTP secret is even read. Covers the decision rules
      # that can condemn a row, the parser contract, and that requiring the
      # ingest does not start one. The script re-runs its own preflight anyway;
      # this fails the job before the download step is reached at all.
      - name: Preflight — prove the rules and the parser before any bytes
        run: node --test test/newegg-dead-sku-audit.test.js

      # The two-strike state lives in an artifact, not a commit, because a
      # read-only audit must not write to the repo to remember what it saw.
      # BY ARTIFACT NAME, NOT BY RUN CONCLUSION.
      #
      # This step used to ask for the last run with `--status success`, which
      # quietly broke the two-strike chain it exists to maintain. A census that
      # withholds verdicts exits 1 BY DESIGN ("a census that cannot condemn must
      # not exit green"), so the runs whose state matters most — the ones that
      # read a feed and recorded what they saw — are exactly the ones a
      # success filter throws away. Run 32078178352 is the case in point: it
      # held 430 strikes under proven-complete coverage and was invisible here,
      # so the next run would have reached past it to 32067140458, whose strikes
      # were earned while MKPL went unread and are discarded on arrival. The
      # chain could never advance; every run would restart at strike one.
      #
      # Carrying state from a failed run is safe by construction, and was always
      # the intent: the upload step below is `if: always()` precisely because "a
      # run that died mid-feed still recorded which skus it saw". Nothing is
      # trusted for being present, either — priorStreakIsBlind() discards strikes
      # earned without full coverage no matter which run they came from.
      - name: Fetch the previous run's strike state
        if: ${{ github.event.inputs.use_prior_state != 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p prev
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=newegg-dead-sku-audit-state&per_page=10" \
                  --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' | head -1 || true)
          if [ -z "${RUN:-}" ]; then
            echo "No prior state artifact — this will be a first-strike run."
            exit 0
          fi
          echo "Prior state from run: $RUN"
          gh run download "$RUN" -n newegg-dead-sku-audit-state -D prev || \
            echo "State artifact unreadable — first-strike run."
          ls -la prev || true

      - name: Census every Newegg sku against the live feed (read-only)
        env:
          RAKUTEN_FTP_PASSWORD: ${{ secrets.RAKUTEN_FTP_PASSWORD }}
          RAKUTEN_NEWEGG_MID: ${{ secrets.RAKUTEN_NEWEGG_MID }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
          MAX_FEED_AGE_DAYS: ${{ github.event.inputs.max_feed_age_days }}
          ALLOW_STALE: ${{ github.event.inputs.allow_stale_feeds }}
        run: |
          set -uo pipefail
          if [ -z "${RAKUTEN_FTP_PASSWORD:-}" ]; then
            echo "::error::RAKUTEN_FTP_PASSWORD is not set on this repository. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          ARGS=""
          if [ -f prev/newegg-dead-sku-audit-state.json ]; then
            ARGS="--prev prev/newegg-dead-sku-audit-state.json"
            echo "Carrying prior strikes forward."
          else
            echo "No prior state on disk — nothing can reach two strikes this run."
          fi
          ARGS="$ARGS --max-feed-age-days ${MAX_FEED_AGE_DAYS:-14}"
          if [ "${ALLOW_STALE:-false}" = "true" ]; then
            echo "::warning::--allow-stale-feeds is on. A stale feed's in-stock row overrides the live feed and hides dead skus. This census is a measurement, not a basis for quarantine."
            ARGS="$ARGS --allow-stale-feeds"
          fi
          node newegg-dead-sku-audit.cjs $ARGS

      - name: Assert the tree came back clean
        if: always()
        run: |
          # Stronger than "parts.js is unchanged": a read-only audit must leave
          # NOTHING behind, tracked or untracked. catalog-build/ is gitignored,
          # so the report and the downloaded feeds do not count -- anything else
          # showing up here is the script writing where it said it would not.
          DIRTY=$(git status --porcelain | grep -v '^?? prev/' || true)
          if [ -n "$DIRTY" ]; then
            echo "::error::a read-only audit modified the working tree"
            echo "$DIRTY"
            exit 1
          fi
          echo "Clean: the audit wrote nothing to the repo."

      - name: Upload the census report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newegg-dead-sku-audit
          path: catalog-build/newegg-dead-sku-audit.json
          if-no-files-found: error
          retention-days: 90

      # Uploaded even on failure: a run that died mid-feed still recorded which
      # skus it saw, and losing that would reset every strike to zero.
      - name: Upload the strike state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newegg-dead-sku-audit-state
          path: catalog-build/newegg-dead-sku-audit-state.json
          if-no-files-found: warn
          retention-days: 90
