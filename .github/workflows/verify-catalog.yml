name: Catalog Verification

on:
  schedule:
    # Tier 1 — every 2 days at 08:00 UTC (CPU/GPU/Mobo/RAM/Storage/PSU/Case)
    - cron: '0 8 */2 * *'
    # Tier 2 — every 3 days at 09:00 UTC (CPUCooler/CaseFan/Monitor)
    - cron: '0 9 */3 * *'
    # Tier 3 — Mondays at 10:00 UTC (peripherals)
    - cron: '0 10 * * 1'
    # Tier 4 — Mondays at 11:00 UTC (accessories)
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to verify (1, 2, 3, or 4)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      fix_asins:
        description: 'Also repair wrong ASINs (--fix-asins)'
        required: false
        default: true
        type: boolean
      force_paapi_unconfigured:
        description: 'SELF-TEST: pretend PA API creds are missing, to prove the gate fails the job loudly'
        required: false
        default: false
        type: boolean

# Repo-wide lock shared by every workflow that pushes to main. The four tiers
# already serialise against each other via this group as a side effect.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine tier from cron schedule
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ github.event.inputs.tier }}" >> $GITHUB_OUTPUT
            echo "fix_asins=${{ github.event.inputs.fix_asins }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 8 */2 * *") echo "tier=1" >> $GITHUB_OUTPUT ;;
              "0 9 */3 * *") echo "tier=2" >> $GITHUB_OUTPUT ;;
              "0 10 * * 1")  echo "tier=3" >> $GITHUB_OUTPUT ;;
              "0 11 * * 1")  echo "tier=4" >> $GITHUB_OUTPUT ;;
              *)             echo "tier=1" >> $GITHUB_OUTPUT ;;
            esac
            echo "fix_asins=true" >> $GITHUB_OUTPUT
          fi

      - name: Run catalog verifier
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # PA API (Amazon Creators) — the buy-box second opinion (PASS 2). Without
          # these the verifier's config gate FAILS the job loudly (not_configured =
          # our bug); a 403 AssociateNotEligible warns and continues on DataForSEO.
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: |
          ARGS="--tier ${{ steps.tier.outputs.tier }} --auto-fix"
          if [ "${{ steps.tier.outputs.fix_asins }}" = "true" ]; then
            ARGS="$ARGS --fix-asins"
          fi
          # Self-test only: on manual dispatch with force_paapi_unconfigured=true,
          # blank the creds for THIS step so the fail-loud gate can be proven in the
          # real CI environment. Never set by the nightly cron.
          if [ "${{ github.event.inputs.force_paapi_unconfigured }}" = "true" ]; then
            echo "::notice::force_paapi_unconfigured=true — blanking PA API creds to self-test the fail-loud gate"
            ARGS="$ARGS --force-unconfigured"
          fi
          echo "Running: node verify-catalog-asins.js $ARGS"
          node verify-catalog-asins.js $ARGS

      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the verifier write, before change-detection, so the barrel + chunks are
      # what we diff/commit. NOTE: the barrel parts.js is stable across price/ASIN
      # fixes — the real change shows up in the chunks, so detection below must
      # include src/data/parts/.
      - name: Re-split catalog into per-category chunks
        run: node scripts/split-parts-by-cat.cjs

      - name: Check for catalog changes
        id: changes
        run: |
          if git diff --quiet src/data/parts.js src/data/parts/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No catalog changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Catalog changes detected"
            git diff --stat src/data/parts.js src/data/parts/
          fi

      - name: Commit and push changes (with rebase retry)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash our changes so rebase doesn't conflict
          git stash push -m "verifier-changes" -- src/data/parts.js src/data/parts/

          # Try up to 3 times in case main keeps moving
          for i in 1 2 3; do
            echo "Push attempt $i/3"
            # Pull latest
            git pull --rebase origin main || { echo "rebase failed"; exit 1; }
            # Re-apply our changes (may need merge if same file changed)
            git stash pop || { echo "stash pop failed - main has conflicting changes to parts.js"; exit 1; }

            git add src/data/parts.js src/data/parts/
            git commit -m "chore(catalog): tier ${{ steps.tier.outputs.tier }} auto-verification

          Automated price/stock/ASIN updates via DataForSEO.
          Triggered by: ${{ github.event_name }}"

            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            else
              echo "Push rejected, retrying..."
              # Reset our local commit so we can re-stash for next attempt
              git reset HEAD~1
              git stash push -m "verifier-changes" -- src/data/parts.js src/data/parts/
              sleep 5
            fi
          done

          echo "All push attempts failed"
          exit 1

      - name: Job summary
        if: always()
        run: |
          echo "## Catalog Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier**: ${{ steps.tier.outputs.tier }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes committed**: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
