name: Catalog Verification

on:
  schedule:
    # Slots are spaced so no two main-writer jobs overlap. Observed medians:
    # verify 9.2 min (max 11.0), prerender 49.6 min (06:00-06:50), price-history
    # 3.6 min (max 11.0 at 07:00), sftp-ingest 11.8 min (max 29.0 at 12:00).
    # Every gap below is >= 45 min.
    #
    # Tier 1 — twice daily, 08:00 and 20:00 UTC (an even 12-hour split)
    #          CPU/GPU/Mobo/RAM/Storage/PSU/Case/CPUCooler
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
    # Tier 2 — daily at 09:00 UTC (CaseFan/Monitor)
    - cron: '0 9 * * *'
    # Tier 3 — daily at 10:00 UTC (peripherals)
    - cron: '0 10 * * *'
    # Tier 4 — daily at 11:00 UTC (accessories)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to verify (1, 2, 3, or 4)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      fix_asins:
        description: 'Also repair wrong ASINs (--fix-asins)'
        required: false
        default: true
        type: boolean
      mode:
        description: 'report-only (verify + report, NO writes) or auto-fix (write price/ASIN fixes to main)'
        required: false
        default: report-only
        type: choice
        options:
          - report-only
          - auto-fix
      force_paapi_unconfigured:
        description: 'SELF-TEST: pretend PA API creds are missing, to prove the gate fails the job loudly'
        required: false
        default: false
        type: boolean

# Repo-wide lock shared by every workflow that pushes to main. The four tiers
# already serialise against each other via this group as a side effect.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine tier from cron schedule
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ github.event.inputs.tier }}" >> $GITHUB_OUTPUT
            echo "fix_asins=${{ github.event.inputs.fix_asins }}" >> $GITHUB_OUTPUT
            # Manual dispatch defaults to report-only (the input default): a rewritten
            # pricing path must never write to main on an operator's say-so without a
            # report read first. auto-fix is opt-in per dispatch.
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 8 * * *")  echo "tier=1" >> $GITHUB_OUTPUT ;;
              "0 20 * * *") echo "tier=1" >> $GITHUB_OUTPUT ;;
              "0 9 * * *")  echo "tier=2" >> $GITHUB_OUTPUT ;;
              "0 10 * * *") echo "tier=3" >> $GITHUB_OUTPUT ;;
              "0 11 * * *") echo "tier=4" >> $GITHUB_OUTPUT ;;
              *)             echo "tier=1" >> $GITHUB_OUTPUT ;;
            esac
            echo "fix_asins=true" >> $GITHUB_OUTPUT
            # A cron carries no inputs; the nightly MUST keep writing, so it is always
            # auto-fix. Only a manual dispatch can choose report-only.
            echo "mode=auto-fix" >> $GITHUB_OUTPUT
          fi

      - name: Run catalog verifier
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # PA API (Amazon Creators) — the buy-box second opinion (PASS 2). Without
          # these the verifier's config gate FAILS the job loudly (not_configured =
          # our bug); a 403 AssociateNotEligible warns and continues on DataForSEO.
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: |
          # mode is 'report-only' or 'auto-fix' → the script's --report-only / --auto-fix
          # flag directly. report-only runs both passes (so meta.paapi.dfsFallback is
          # real) but commits nothing; the change-detection gate below then finds no
          # diff and the push step is skipped.
          ARGS="--tier ${{ steps.tier.outputs.tier }} --${{ steps.tier.outputs.mode }}"
          if [ "${{ steps.tier.outputs.fix_asins }}" = "true" ]; then
            ARGS="$ARGS --fix-asins"
          fi
          # Self-test only: on manual dispatch with force_paapi_unconfigured=true,
          # blank the creds for THIS step so the fail-loud gate can be proven in the
          # real CI environment. Never set by the nightly cron.
          if [ "${{ github.event.inputs.force_paapi_unconfigured }}" = "true" ]; then
            echo "::notice::force_paapi_unconfigured=true — blanking PA API creds to self-test the fail-loud gate"
            ARGS="$ARGS --force-unconfigured"
          fi
          echo "Running: node verify-catalog-asins.js $ARGS"
          node verify-catalog-asins.js $ARGS

      # One Amazon listing on two catalog rows means at most one of them is
      # right. The verifier cannot see it — it checks a row against its own ASIN,
      # never two rows against each other — so this runs after the write, over
      # whatever the verifier just left behind. Report only: it never touches the
      # catalog, and it warns rather than failing, because the fix needs a person
      # with the Amazon listing open.
      - name: Audit ASINs shared by more than one product
        if: always()
        run: node audit-duplicate-asins.js

      - name: Upload the duplicate-ASIN report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-asins
          path: verify-reports/duplicate-asins-*.json
          if-no-files-found: warn
          retention-days: 90

      # The verifier's own report — carries meta.paapi.{paConfirmed,dfsFallback}, the
      # PA-settled-for-$0 vs DataForSEO-billed split. This is what a report-only dry
      # outing is read for before anyone commits an auto-fix run.
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-verification-report
          path: |
            verify-reports/report-*.json
            verify-reports/report-*.md
          if-no-files-found: warn
          retention-days: 90

      # Re-emit the per-category chunk barrel so the frontend (which loads
      # src/data/parts/<cat>.js, not the literal) never goes stale. Runs after
      # the verifier write, before change-detection, so the barrel + chunks are
      # what we diff/commit. NOTE: the barrel parts.js is stable across price/ASIN
      # fixes — the real change shows up in the chunks, so detection below must
      # include src/data/parts/.
      - name: Re-split catalog into per-category chunks
        run: node scripts/split-parts-by-cat.cjs

      - name: Check for catalog changes
        id: changes
        run: |
          if git diff --quiet src/data/parts.js src/data/parts/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No catalog changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Catalog changes detected"
            git diff --stat src/data/parts.js src/data/parts/
          fi

      - name: Commit and push changes (with rebase retry)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash our changes so rebase doesn't conflict
          git stash push -m "verifier-changes" -- src/data/parts.js src/data/parts/

          # Try up to 3 times in case main keeps moving
          for i in 1 2 3; do
            echo "Push attempt $i/3"
            # Pull latest
            git pull --rebase origin main || { echo "rebase failed"; exit 1; }
            # Re-apply our changes (may need merge if same file changed)
            git stash pop || { echo "stash pop failed - main has conflicting changes to parts.js"; exit 1; }

            git add src/data/parts.js src/data/parts/
            git commit -m "chore(catalog): tier ${{ steps.tier.outputs.tier }} auto-verification

          Automated price/stock/ASIN updates via DataForSEO.
          Triggered by: ${{ github.event_name }}"

            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            else
              echo "Push rejected, retrying..."
              # Reset our local commit so we can re-stash for next attempt
              git reset HEAD~1
              git stash push -m "verifier-changes" -- src/data/parts.js src/data/parts/
              sleep 5
            fi
          done

          echo "All push attempts failed"
          exit 1

      - name: Job summary
        if: always()
        run: |
          echo "## Catalog Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier**: ${{ steps.tier.outputs.tier }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ steps.tier.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes committed**: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          # Surface the Migration 3 spend split straight from the report meta so a
          # report-only run's DataForSEO fallback count is visible without downloading
          # the artifact. dfsFallback = rows that still billed DataForSEO this run.
          REPORT=$(ls -t verify-reports/report-*.json 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const p=(r.meta&&r.meta.paapi)||{};const s=process.env.GITHUB_STEP_SUMMARY;fs.appendFileSync(s,'- **Rows checked**: '+(r.meta&&r.meta.checked)+'\n');fs.appendFileSync(s,'- **PA API confirmed (\$0)**: '+(p.paConfirmed??'n/a')+'\n');fs.appendFileSync(s,'- **DataForSEO fallback rows (billed)**: '+(p.dfsFallback??'n/a')+'\n');" "$REPORT"
          fi
