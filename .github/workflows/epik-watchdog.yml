name: Epik deploy watchdog

# =============================================================================
#  THE PRIMARY ALARM for the pull deploy, and a direct answer to the sftp-ingest
#  timeout that went unnoticed for a week: a PASSIVE signal that only appears
#  when someone looks is not an alarm.
#
#  This runs on a schedule whether or not anyone deployed. It reads the status
#  file the box writes into the live tree (the site is the status channel — there
#  is no inbound path to the host) and FAILS THE WORKFLOW on anything wrong,
#  which sends a GitHub notification and shows a red run with no human in the
#  loop. Worst-case detection: 30 minutes.
#
#  TWO CLAIMS, TWO FIELDS, TWO RULES. The status file separates:
#    checked_at   the deploy loop RAN (stamped by every cron tick, including the
#                 ~287 of 288 daily ticks that find nothing to do)
#    verified_at  a VERDICT about health was reached (moves only with `health`)
#  Until 2026-08-12 there was only checked_at, and the routine tick wrote
#  nothing — so with one publish a day it sat untouched for ~23 hours out of 24
#  while the rule below read it as "the cron has stopped running". The primary
#  alarm was therefore red almost permanently, which is how an alarm gets muted
#  and how a real failure arrives as one more red run nobody reads. It also
#  could not detect what it claimed: a stopped cron and a quiet one looked
#  identical. Staleness now reads checked_at; health reads verified_at.
#
#  ── EPIK_ORIGIN_IP: the pre-DNS window ──────────────────────────────────────
#  This step reads the status file over HTTPS at the PRODUCTION hostname. Between
#  the docroot flip and the DNS move, prorigbuilder.com still answers from
#  RAILWAY, so an unpinned read measures the stack we are migrating away from and
#  reports its 404/HTML as "the box is broken" — a red run every 30 minutes
#  during the exact burn-in that is supposed to earn trust in this alarm. That is
#  how an alarm gets muted. publish-epik.yml's confirm-poll already carries the
#  fix; this now does too, and reaches the SAME verdict by the SAME rule:
#    - EPIK_ORIGIN_IP set  -> pin with --resolve + -k (the origin carries a
#      Cloudflare Origin CA cert no public store validates), so the read reaches
#      the box by construction and every failure is really the box's.
#    - EPIK_ORIGIN_IP unset, and the hostname answered with a foreign web page ->
#      CANNOT VERIFY. It says so and stays GREEN, rather than reporting a health
#      verdict on a box it never measured. This is hc_verdict() from epik-pull.sh,
#      ported verbatim below.
#  Production only — staging is grey-cloud and already resolves to the box. Set
#  the repo variable before the burn-in; CLEAR it at cutover so the read goes
#  back through the edge, the thing the world actually reaches.
#
#  It fails on:
#    - status file unreachable, non-200, or unparseable
#    - checked_at older than STALE_MIN (the cron has stopped running AT ALL —
#      the exact silent-stall class of failure)
#    - verified_at ABSENT — that box is running a pre-heartbeat epik-pull.sh.
#      bin/epik-pull.sh is a COPY curl'd at install time, so a box silently
#      keeps old behaviour after the repo is fixed; this makes that visible
#      instead of letting the watchdog grade a script it did not think it had.
#    - health != ok, or a rolled_back / verify_failed / docroot failure
#    - live_sha != the sha currently published on the release branch, once the
#      publish is old enough that the box has had time to pull it
#    - env.dir_resolved false — the R1 invariant of DESIGN §3.2 has broken
#    - opcache enabled with validate_timestamps off — DESIGN §3.3. The 2026-08-12
#      host could not be probed for this (introspection locked down), so the
#      design detects the condition instead of assuming it away.
# =============================================================================

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      # A gate that has never fired is unproven. A scheduled run watches whatever
      # the EPIK_WATCH_* vars say; this lets a MANUAL run watch production (and so
      # exercise the pinned read + hc_verdict) on demand — WITHOUT setting
      # EPIK_WATCH_PRODUCTION, which would also arm the scheduled alarm before its
      # code is on main. 'as-configured' (the default, and what every scheduled
      # run gets since it carries no inputs) reads the vars unchanged.
      watch:
        description: 'Targets for THIS manual run (scheduled runs always use the EPIK_WATCH_* vars)'
        type: choice
        options: [as-configured, production, staging, both]
        default: as-configured

permissions:
  contents: read

concurrency:
  group: epik-watchdog
  cancel-in-progress: true

jobs:
  # Which targets to watch is data, not duplicated YAML. During Phase A only
  # staging is pulled (production is still on Railway), so only staging is
  # watched. Set EPIK_WATCH_PRODUCTION=true at cutover.
  setup:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          WATCH_STAGING: ${{ vars.EPIK_WATCH_STAGING }}
          WATCH_PROD: ${{ vars.EPIK_WATCH_PRODUCTION }}
          STAGING_URL: ${{ vars.EPIK_STAGING_URL }}
          # Production only. Staging is grey-cloud and already resolves to the box,
          # so pinning it would assert something already true. Empty = follow DNS.
          ORIGIN_IP: ${{ vars.EPIK_ORIGIN_IP }}
          # '' on a scheduled run (no inputs) -> "as-configured" below.
          OVERRIDE: ${{ github.event.inputs.watch }}
        run: |
          set -euo pipefail
          node -e '
            const t=[];
            // A scheduled run carries no inputs, so OVERRIDE is "" -> "as-configured",
            // which reads the EPIK_WATCH_* vars exactly as before. A manual dispatch
            // may override, so the pinned production read can be PROVEN on demand
            // without setting EPIK_WATCH_PRODUCTION (which would also arm the
            // scheduled alarm before its code is on main).
            const override = process.env.OVERRIDE || "as-configured";
            const on = (name, v) => override === name || override === "both" ||
                                    (override === "as-configured" && v === "true");
            if (on("staging", process.env.WATCH_STAGING)) {
              t.push({ name:"staging", url:process.env.STAGING_URL, branch:"epik-release-staging", auth:true, origin_ip:"" });
            }
            if (on("production", process.env.WATCH_PROD)) {
              t.push({ name:"production", url:"https://prorigbuilder.com", branch:"epik-release", auth:false, origin_ip:process.env.ORIGIN_IP || "" });
            }
            if (!t.length) { console.log("::warning::no targets — set EPIK_WATCH_STAGING/PRODUCTION, or dispatch with the watch input"); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "targets=" + JSON.stringify({include:t}) + "\n");
          '

  watch:
    needs: setup
    if: fromJSON(needs.setup.outputs.targets).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.targets) }}
    name: watch (${{ matrix.name }})
    steps:
      - name: Assert the box is alive and honest
        env:
          SITE: ${{ matrix.url }}
          BRANCH: ${{ matrix.branch }}
          AUTH: ${{ matrix.auth && secrets.EPIK_STAGING_BASIC_AUTH || '' }}
          ORIGIN_IP: ${{ matrix.origin_ip }}
          REPO: ${{ github.repository }}
          # checked_at: the cron is */5, so 20 min is four missed ticks.
          STALE_MIN: '20'
          # verified_at: health is only re-measured when something HAPPENS (a
          # deploy, a failure, a manual --check). With one publish a day the
          # normal steady state is up to ~24h old, so this is a WARNING
          # threshold, not a failure one — set past a full nightly cycle plus
          # margin. Failing here would recreate the exact cries-wolf problem the
          # checked_at/verified_at split was made to fix.
          VERIFY_WARN_MIN: '1560'   # 26h
          # How long after a publish the box is still allowed to be behind before
          # a sha mismatch counts as a failure. Cron is */5 and raw.githubusercontent
          # can hold RELEASE.json in CDN cache for ~5 min, so ~10 min is the real
          # worst case; 20 gives it margin. Without this the watchdog would go red
          # after every single deploy, and an alarm that cries wolf gets muted —
          # which is the failure mode this workflow exists to prevent.
          INFLIGHT_MIN: '20'
        run: |
          set -uo pipefail
          ARGS=(-sS --max-time 25 -w '\n%{http_code}')
          [ -n "$AUTH" ] && ARGS+=(-u "$AUTH")

          # Pin to the origin when EPIK_ORIGIN_IP is set (production, pre-DNS),
          # exactly as publish-epik.yml's confirm-poll does: --resolve forces the
          # request to this box, and -k accepts the Cloudflare Origin CA cert that
          # no public trust store validates by design. Unset -> follow DNS.
          HOST=${SITE#*://}; HOST=${HOST%%/*}; HOST=${HOST%%:*}
          PINNED=0
          if [ -n "$ORIGIN_IP" ]; then
            ARGS+=(--resolve "$HOST:443:$ORIGIN_IP" -k)
            PINNED=1
            echo "reading status file at $SITE (pinned: $HOST:443 -> $ORIGIN_IP, cert not validated)"
          else
            echo "reading status file at $SITE (whatever DNS resolves $HOST to)"
          fi

          RAWSTATUS=$(curl "${ARGS[@]}" "$SITE/_deploy-status.json?t=${GITHUB_RUN_ID}" 2>/dev/null || true)
          CODE=$(printf '%s' "$RAWSTATUS" | tail -1)
          BODY=$(printf '%s' "$RAWSTATUS" | sed '$d')

          PUBLISHED=$(curl -sS --max-time 25 \
            "https://raw.githubusercontent.com/$REPO/$BRANCH/RELEASE.json" 2>/dev/null || true)

          CODE="$CODE" BODY="$BODY" PUBLISHED="$PUBLISHED" \
          PINNED="$PINNED" ORIGIN_IP="$ORIGIN_IP" SITE="$SITE" node <<'NODE'
          const fail = [], warn = [];
          const staleMin = Number(process.env.STALE_MIN);
          const inflightMin = Number(process.env.INFLIGHT_MIN);
          const verifyWarnMin = Number(process.env.VERIFY_WARN_MIN);
          const mins = (t) => (Date.now() - Date.parse(t)) / 60000;
          const ago  = (m) => m < 90 ? `${m.toFixed(0)} min` : `${(m / 60).toFixed(1)} h`;

          const code = process.env.CODE || '';
          const body = process.env.BODY || '';
          const pinned = process.env.PINNED === '1';

          // Parse once. "mine" = a reply shaped like OUR status file: valid JSON
          // carrying a field only we write (checked_at on every tick, live_sha on
          // every deploy). A foreign stack answering this hostname returns HTML or
          // someone else's JSON and fails this test — so mine==1 PROVES the read
          // reached the box, pinned or not.
          let s = null;
          try { s = JSON.parse(body); } catch (e) {}
          const looksMine = s !== null && (s.checked_at !== undefined || s.live_sha !== undefined);
          const mine = (code === '200' && looksMine) ? 1 : 0;

          // "foreign" = HTTP 200 that is a web PAGE, not our JSON. This endpoint
          // serves pure JSON, so a body opening with '<' came from something that
          // is not this release. ('<?php' mirrors epik-pull.sh's classify_env — an
          // unexecuted copy of our own PHP would open that way; a status file is
          // never PHP, but the guard is kept so the rule stays identical.)
          const head = body.replace(/^\s+/, '');
          const foreign = (code === '200' && head.startsWith('<') && !head.startsWith('<?php')) ? 1 : 0;

          const bad = mine ? 0 : 1;

          // hc_verdict(), ported verbatim from deploy/epik-pull.sh so the box and
          // the watchdog judge the SAME evidence the SAME way:
          //   reached the box (mine)            -> judge health for real
          //   pinned, and it did not answer     -> the box's fault, alarm
          //   unpinned, a foreign page answered -> never measured the box; cannot
          //                                        verify (the hostname resolves
          //                                        elsewhere — Railway, pre-cutover)
          const verdict = bad === 0 ? 'ok'
                        : pinned    ? 'unhealthy'
                        : (mine === 0 && foreign > 0) ? 'unverified'
                        : 'unhealthy';

          if (verdict === 'unverified') {
            // NOT a health verdict — the same thing --check exits 3 for. Inventing
            // "the box is broken" from evidence that fits two stories is exactly
            // what hc_verdict refuses, so this WARNS and stays green.
            console.log(`::warning::CANNOT VERIFY ${process.env.SITE} — the hostname answered with a web page from something that is not this release, and this poll was NOT pinned. "The box is broken" and "the hostname still resolves elsewhere (Railway, pre-cutover)" are indistinguishable from here, so this is not a verdict on the box. Pin it: set the EPIK_ORIGIN_IP repo variable to the origin IP; clear it once DNS points here.`);
            console.log(`not verified — http=${code || '(none)'}, pinned=false`);
            process.exit(0);
          }

          if (verdict === 'unhealthy') {
            if (pinned) {
              fail.push(`the poll was PINNED to ${process.env.ORIGIN_IP}, so it reached the box by construction — and the box did not return its status file (HTTP ${code || '(no response)'}${looksMine ? '' : ', body is not our JSON'}). A real failure on the box.`);
            } else {
              fail.push(`status file unreachable (HTTP ${code || '(no response)'}) and nothing answered like our status file or like another stack — the box is unreachable or not serving.`);
            }
            for (const f of fail) console.log(`::error::${f}`);
            console.log(`\nWATCHDOG FAILED — ${fail.length} problem(s).`);
            console.log(`status: ${body || '(none)'}`);
            process.exit(1);
          }

          // verdict === 'ok': we hold OUR status file, so the read provably reached
          // the box (pinned or not) and every rule below is a real judgement.
          if (s) {
            // ── RULE 1: is the loop alive? reads checked_at ──────────────────
            const ageMin = mins(s.checked_at);
            if (!Number.isFinite(ageMin)) {
              fail.push(`checked_at unparseable: ${s.checked_at}`);
            } else if (ageMin > staleMin) {
              fail.push(`checked_at is ${ago(ageMin)} old (> ${staleMin} min) — the cron has stopped running. `
                      + `Every tick stamps this field, including the quiet ones, so a stale value here is the `
                      + `loop itself, NOT a lack of deploys.`);
            }

            // ── RULE 2: how old is the health verdict? reads verified_at ─────
            // Absent means the box is running a pre-2026-08-12 epik-pull.sh.
            // Do not silently fall back to checked_at: that would grade a quiet
            // heartbeat as if it were a fresh health measurement, which is the
            // conflation this split exists to remove.
            let verAge = null;
            if (s.verified_at === undefined) {
              fail.push('status file has NO verified_at field — this box is running a pre-heartbeat '
                      + 'epik-pull.sh. bin/epik-pull.sh is a COPY curl\'d at install time, so fixing the repo '
                      + 'does not fix the box. Re-curl it onto EVERY install root: '
                      + 'curl -fsSL https://raw.githubusercontent.com/tiereduptech/pro-rig-builder/main/deploy/epik-pull.sh '
                      + '-o <root>/bin/epik-pull.sh && chmod +x <root>/bin/epik-pull.sh');
            } else {
              verAge = mins(s.verified_at);
              if (!Number.isFinite(verAge)) {
                fail.push(`verified_at unparseable: ${s.verified_at}`);
              } else if (verAge > verifyWarnMin) {
                warn.push(`health "${s.health}" was last MEASURED ${ago(verAge)} ago (> ${verifyWarnMin} min). `
                        + `The loop is alive (checked_at ${ago(ageMin)} old), but nothing has deployed or been `
                        + `--check'd in over a nightly cycle, so this verdict is old rather than wrong.`);
              }
            }

            if (s.health !== 'ok') {
              fail.push(`health = "${s.health}"${s.message ? ` — ${s.message}` : ''}`
                      + `${verAge !== null && Number.isFinite(verAge) ? ` (measured ${ago(verAge)} ago)` : ''}`);
            }

            const env = s.env || {};
            if (env.dir_resolved === false) {
              fail.push('env.dir_resolved is FALSE — the R1 invariant broke (DESIGN §3.2): __DIR__ is no longer '
                      + 'the resolved release path, so the resolver can mix releases within one request');
            }
            const on = (v) => v !== undefined && v !== null && v !== '' && v !== '0' && String(v).toLowerCase() !== 'off';
            if (on(env.opcache_enable) && !on(env.opcache_validate_timestamps)) {
              fail.push('opcache is ENABLED with validate_timestamps OFF (DESIGN §3.3). This combination was never '
                      + 'testable on the probe host. R1 is now the only thing preventing stale compiled bytes — '
                      + 'verify per-release path keying before trusting a deploy.');
            } else if (on(env.opcache_enable)) {
              warn.push('opcache is now enabled (validate_timestamps on) — it was inert when the design was measured');
            }

            let pub = null;
            try { pub = JSON.parse(process.env.PUBLISHED); } catch (e) {}
            if (!pub) {
              warn.push('could not read the published RELEASE.json — skipped the sha comparison');
            } else if (pub.source_sha !== s.live_sha) {
              const pubAge = (Date.now() - Date.parse(pub.built_at)) / 60000;
              if (Number.isFinite(pubAge) && pubAge < inflightMin) {
                warn.push(`live_sha ${String(s.live_sha).slice(0,8)} is behind published ${String(pub.source_sha).slice(0,8)}, `
                        + `but that release is only ${pubAge.toFixed(0)} min old — in flight, not failed`);
              } else {
                fail.push(`live_sha ${s.live_sha} != published ${pub.source_sha} — a deploy never landed, `
                        + `or landed and rolled back (published ${Number.isFinite(pubAge) ? pubAge.toFixed(0)+' min' : 'age unknown'} ago)`);
              }
            }
          }

          for (const w of warn) console.log(`::warning::${w}`);
          if (fail.length) {
            for (const f of fail) console.log(`::error::${f}`);
            console.log(`\nWATCHDOG FAILED — ${fail.length} problem(s).`);
            console.log(`status: ${process.env.BODY || '(none)'}`);
            process.exit(1);
          }
          console.log(`ok — live_sha=${s && s.live_sha}, health=${s && s.health}`);
          console.log(`     loop ran ${s ? ago(mins(s.checked_at)) : '?'} ago (checked_at=${s && s.checked_at})`);
          console.log(`     health measured ${s && s.verified_at ? ago(mins(s.verified_at)) : '?'} ago (verified_at=${s && s.verified_at})`);
          NODE
