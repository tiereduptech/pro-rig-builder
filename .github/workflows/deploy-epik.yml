name: Deploy dist to Epik (SFTP)

# Runs AFTER dist/ lands on main (the nightly prerender commits it, or a manual
# edit does). The prerender stays on Actions — shared hosting can't run the
# 45-minute headless-Chrome job — this workflow only ships the finished dist/.
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'deploy/**'
      - '.github/workflows/deploy-epik.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [staging, production]
        default: staging
      full:
        description: 'Full upload (ignore remote manifest)'
        type: boolean
        default: false
      prune:
        description: 'Prune orphaned remote files after verify'
        type: boolean
        default: false

# Serialize deploys. cancel-in-progress:false is deliberate — cancelling a run
# mid-upload is exactly the half-deploy we are avoiding, so we QUEUE instead.
concurrency:
  group: deploy-epik-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # dist/ is committed, but regenerate the Epik artifacts so resolver-config.php
      # / redirects.php / gone.html / .htaccess can never drift from source.
      - name: Regenerate Epik artifacts
        run: node build-epik.cjs

      - name: Upload dist/ over SFTP (safe-to-interrupt, verified)
        env:
          EPIK_SFTP_HOST: ${{ secrets.EPIK_SFTP_HOST }}
          EPIK_SFTP_PORT: ${{ secrets.EPIK_SFTP_PORT }}
          EPIK_SFTP_USER: ${{ secrets.EPIK_SFTP_USER }}
          EPIK_SFTP_PRIVATE_KEY: ${{ secrets.EPIK_SFTP_PRIVATE_KEY }}
          EPIK_SFTP_PASSPHRASE: ${{ secrets.EPIK_SFTP_PASSPHRASE }}
          # Staging vs production docroot. workflow_dispatch picks; push events
          # (nightly) go to production.
          EPIK_REMOTE_ROOT: >-
            ${{ (github.event.inputs.target == 'staging')
                && secrets.EPIK_REMOTE_ROOT_STAGING
                || secrets.EPIK_REMOTE_ROOT }}
        run: |
          node deploy/sftp-deploy.cjs \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }} \
            ${{ github.event.inputs.prune == 'true' && '--prune' || '' }}

      # HARD GATE — HTTP-level parity check against the just-deployed site, same
      # non-tolerant pattern as verify-prerender.cjs. A non-zero exit fails the job.
      - name: Verify live parity (fixture)
        env:
          BASE: >-
            ${{ (github.event.inputs.target == 'staging')
                && vars.EPIK_STAGING_URL
                || 'https://prorigbuilder.com' }}
        run: node test/verify-epik.cjs epik="$BASE"
