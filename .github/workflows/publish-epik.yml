name: Publish Epik release artifact

# The runs list shows every publish under the same name, and a staging run is
# indistinguishable from a production one there — which is exactly how a staging
# green gets misread as a production release. Name the run after the channel it
# actually targets. github.event.inputs.target is '' on a push, so the fallback
# here is 'production' — the SAME resolution as the TARGET env below, so the
# title never disagrees with what the job does.
run-name: "Publish Epik → ${{ github.event.inputs.target || 'production' }} (${{ github.event_name }})"

# =============================================================================
#  PUBLISH ONLY — this workflow never touches the live site.
#
#  The Epik host firewalls INBOUND connections, so CI cannot reach the box. We
#  invert the direction: this job publishes a single-commit orphan branch that
#  both sides can reach over outbound 443, and a cron on the box pulls it.
#  Nothing ever connects in. See deploy/DESIGN-pull-deploy.md §5.
#
#  It force-pushes `epik-release` / `epik-release-staging` and NEVER main, so it
#  cannot join the main-writer race that the nightly prerender, price-history,
#  verify-catalog and asin-identity-audit workflows already contend in.
#
#  The repo is public, which is deliberate: the box needs NO credential to pull.
#  Nothing to rotate, nothing to leak. Two consequences are enforced below —
#  the artifact must never contain .htpasswd (step "Guard assertions"), and the
#  staging Basic-Auth hash therefore lives on the box, not in the artifact.
#
#  ── EPIK_ORIGIN_IP: the pre-DNS window ──────────────────────────────────────
#  Two steps here read the LIVE production site over HTTPS: "R2" compares the
#  live .htaccess hash, and "Confirm the box went live" polls the status file.
#  Between the docroot flip (Phase B step 3) and the DNS move (step 8),
#  prorigbuilder.com still answers from RAILWAY, so both would measure the stack
#  we are migrating away from. This is the same trap that made a clean staging
#  flip print "unhealthy", and epik-pull.sh already carries the fix (ORIGIN_IP +
#  curl --resolve). Both steps below take it too.
#
#  Set the repo VARIABLE  EPIK_ORIGIN_IP = <the box's public IP>  before the
#  Phase B burn-in; CLEAR it once DNS points at the box, so the poll goes back
#  to measuring what the world actually reaches. It applies to production only —
#  staging is grey-cloud and its DNS already resolves to the box, so pinning it
#  would assert something that is already true.
#
#  Pinned requests are sent with -k. The origin carries a Cloudflare Origin CA
#  cert, which no public trust store validates BY DESIGN — only Cloudflare's edge
#  does. See deploy/PHASE-B-INSTALL.md §6.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which release branch to publish'
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'Poll the site until the box confirms it went live'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'deploy/**'
      - 'build-epik.cjs'
      - '.github/workflows/publish-epik.yml'

# Same reasoning as deploy-epik.yml: cancelling mid-publish is the half-artifact
# we are avoiding, so overlapping runs QUEUE rather than cancel.
concurrency:
  group: epik-publish-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # force-push the orphan release branch
    # Push-triggered PRODUCTION publishing stays off until the repo variable is
    # set, mirroring EPIK_PROD_AUTO_DEPLOY on deploy-epik.yml. During Phase A
    # (staging only, production still on Railway) every publish is a manual
    # workflow_dispatch. Flip the var at cutover.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.EPIK_PULL_AUTO_PUBLISH == 'true'

    env:
      TARGET: ${{ github.event.inputs.target || 'production' }}

    steps:
      # Legibility banner, FIRST so it is on the summary even if a later step
      # fails. The runs-list title (run-name) answers "which channel" at a
      # glance; this answers it in full — the branch that gets force-pushed and
      # the host the confirm will poll — so a staging run can never be mistaken
      # for a production one from inside the run either.
      - name: Announce the channel
        env:
          SITE: ${{ env.TARGET == 'staging' && vars.EPIK_STAGING_URL || 'https://prorigbuilder.com' }}
        run: |
          if [ "$TARGET" = staging ]; then BR=epik-release-staging; else BR=epik-release; fi
          {
            echo "## Publishing to \`$TARGET\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| channel | \`$TARGET\` |"
            echo "| release branch | \`$BR\` (force-pushed) |"
            echo "| source sha | \`$GITHUB_SHA\` |"
            echo "| confirm polls | $SITE |"
            echo "| trigger | \`$GITHUB_EVENT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The two decisions in the deploy path that cannot be exercised end to end
      # from a dev box (git-bash has no symlink privilege; a healthcheck needs a
      # box and a DNS record). Both are pure functions, so their truth tables run
      # here instead — one guards against burying a live docroot, the other
      # against reporting a fault on a box that was never asked.
      - name: Deploy-path truth tables
        run: |
          bash test/install-phase-a.docroot.test.sh
          bash test/epik-pull.hcverdict.test.sh

      # dist/ is committed, but the Epik artifacts are regenerated so
      # resolver-config.php / redirects.php / gone.html / .htaccess / _env.php
      # can never drift from source. build-epik.cjs remains the single source of
      # truth and still refuses to build a guard-contaminated production artifact.
      #
      # EPIK_REMOTE_ROOT is used by build-epik.cjs for ONE thing: the AuthUserFile
      # path in the staging guard. For the pull deploy we point it at the box's
      # secrets directory rather than the docroot, so the .htaccess references a
      # .htpasswd that lives OUTSIDE the release tree. That is what lets a staging
      # artifact be published to a public branch without publishing a credential.
      - name: Regenerate Epik artifacts
        env:
          # The staging value is a directory path on the box, not a credential —
          # it is in the design doc and the crontab already. It defaults so Phase A
          # needs no new secret; override only if the install root moves.
          EPIK_REMOTE_ROOT: ${{ env.TARGET == 'staging' && (secrets.EPIK_PULL_SECRETS_DIR || '/home/tier5415/prb-staging/secrets') || secrets.EPIK_REMOTE_ROOT }}
          EPIK_STAGING_BASIC_AUTH: ${{ secrets.EPIK_STAGING_BASIC_AUTH }}
        run: node build-epik.cjs ${{ env.TARGET == 'staging' && '--staging' || '' }}

      # The staging build writes dist/.htpasswd (the hashed credential). It must
      # NOT be published. The box holds that file, placed once by hand, at the
      # path the guard's AuthUserFile points to.
      - name: Drop the staging credential before it can be published
        if: env.TARGET == 'staging'
        run: rm -f dist/.htpasswd

      # The box verifies itself with the SAME harness and fixture CI uses, rather
      # than a bash twin that would drift from it. .htaccess denies /_ops/ so this
      # is never served. (node is confirmed present on the box — DESIGN §10.)
      - name: Ship the healthcheck harness inside the artifact
        run: |
          mkdir -p dist/_ops
          cp test/verify-epik.cjs test/epik-fixture.json dist/_ops/

      - name: Manifest
        working-directory: dist
        run: |
          find . -type f \
            ! -name MANIFEST.sha256 ! -name RELEASE.json \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          echo "files: $(wc -l < MANIFEST.sha256)"

      - name: RELEASE.json
        id: rel
        run: |
          set -euo pipefail
          HT_SHA=$(sha256sum dist/.htaccess | cut -d' ' -f1)
          MAN_SHA=$(sha256sum dist/MANIFEST.sha256 | cut -d' ' -f1)
          COUNT=$(wc -l < dist/MANIFEST.sha256)
          echo "htaccess_sha256=$HT_SHA" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MAN_SHA" >> "$GITHUB_OUTPUT"
          echo "file_count=$COUNT"       >> "$GITHUB_OUTPUT"
          # htaccess_changed is filled in by the next step; written last so the
          # file is always complete when the manifest hash above is computed.
          printf '%s\n' "$HT_SHA" > /tmp/ht.sha
          printf '%s\n' "$MAN_SHA" > /tmp/man.sha
          printf '%s\n' "$COUNT" > /tmp/count

      # ── Guard assertions (belt and braces over build-epik.cjs's own) ─────────
      # A committed .htpasswd on a public repo is a credential leak, so it is a
      # hard fail on BOTH targets. The staging sentinel is asserted in both
      # directions: absent on production (it would 401 the live site) and PRESENT
      # on staging (a staging artifact that lost its guard is crawlable).
      - name: Guard assertions
        run: |
          set -euo pipefail
          if find dist -name '.htpasswd' | grep -q .; then
            echo "::error::.htpasswd present in the artifact — the release branch is PUBLIC. Refusing."; exit 1
          fi
          if [ "$TARGET" = 'production' ]; then
            if grep -q 'PRB-STAGING-GUARD' dist/.htaccess; then
              echo "::error::production artifact carries the staging guard sentinel"; exit 1
            fi
          else
            if ! grep -q 'PRB-STAGING-GUARD' dist/.htaccess; then
              echo "::error::staging artifact is MISSING its Basic-Auth guard — it would be publicly crawlable"; exit 1
            fi
            if grep -qi 'AuthUserFile .*/public_html' dist/.htaccess; then
              echo "::error::staging AuthUserFile points into a served directory — set EPIK_PULL_SECRETS_DIR"; exit 1
            fi
          fi
          echo "guards ok for target=$TARGET"

      # ── R2: detect an .htaccess change and make it LOUD, without blocking ────
      # A hard block fires on legitimate edits, and an override flag passed
      # reflexively is worse than no gate at all. So this warns, and sets
      # htaccess_changed in the artifact — which is what puts the box on the
      # slower settle path (§6.7) with nobody having to remember to ask.
      #
      # THIS is the step the origin pin exists for, more than the confirm-poll
      # below. Unpinned in the pre-DNS window it reads Railway's (nonexistent)
      # RELEASE.json, takes the "nothing to compare" branch, and ships
      # htaccess_changed=false for a release that DID change .htaccess — putting
      # the box on the FAST healthcheck path. No warning, no red run, no trace.
      # A silent degradation of a safety mechanism is worse than a loud failure,
      # so when the request is NOT pinned the "nothing to compare" branch says so.
      - name: R2 — .htaccess change detection (warn, never fail)
        id: r2
        env:
          SITE: ${{ env.TARGET == 'staging' && vars.EPIK_STAGING_URL || 'https://prorigbuilder.com' }}
          AUTH: ${{ env.TARGET == 'staging' && secrets.EPIK_STAGING_BASIC_AUTH || '' }}
          ORIGIN_IP: ${{ env.TARGET == 'production' && vars.EPIK_ORIGIN_IP || '' }}
        run: |
          set -uo pipefail
          NEW=$(cat /tmp/ht.sha)
          HOST=${SITE#*://}; HOST=${HOST%%/*}; HOST=${HOST%%:*}
          ARGS=(-sS --max-time 20)
          [ -n "$AUTH" ] && ARGS+=(-u "$AUTH")
          if [ -n "$ORIGIN_IP" ]; then
            ARGS+=(--resolve "$HOST:443:$ORIGIN_IP" -k)
            WHERE="pinned: $HOST:443 -> $ORIGIN_IP (cert not validated)"
          else
            # Same wording as epik-pull.sh's site_desc(), and neutral on purpose:
            # following DNS is CORRECT for staging (grey-cloud, resolves to the
            # box). It is only a problem for production before the DNS move, and
            # that case is called out where it actually bites, below.
            WHERE="whatever DNS resolves $HOST to"
          fi
          echo "comparing .htaccess against $SITE"
          echo "  went to: $WHERE"
          LIVE=$(curl "${ARGS[@]}" "$SITE/RELEASE.json" 2>/dev/null \
                 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).htaccess_sha256||""))}catch(e){process.stdout.write("")}})' || true)
          if [ -z "$LIVE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ -n "$ORIGIN_IP" ]; then
              echo "no live RELEASE.json at the pinned origin (first publish, or the box has never pulled) — not flagging"
            else
              echo "::warning::.htaccess comparison was NOT pinned and found no live RELEASE.json — shipping htaccess_changed=false, which puts the box on the FAST healthcheck path. Set the EPIK_ORIGIN_IP repo variable."
              echo "Two very different situations look identical from here:"
              echo "  a) this is a first publish / the box has never pulled, or"
              echo "  b) $HOST still answers from another stack and this request never reached the box."
              echo "Only (a) makes htaccess_changed=false the right answer. Pin it and the"
              echo "ambiguity disappears: set the EPIK_ORIGIN_IP repo variable to the origin IP."
            fi
          elif [ "$LIVE" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ".htaccess unchanged ($NEW)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::.htaccess CHANGED in this release ($LIVE -> $NEW). The box will take the slower settle path (§6.7)."
            {
              echo "## .htaccess changed in this release"
              echo ""
              echo "| | sha256 |"
              echo "|---|---|"
              echo "| live | \`$LIVE\` |"
              echo "| new  | \`$NEW\` |"
              echo ""
              echo "The artifact carries \`htaccess_changed: true\`, so \`epik-pull.sh\` moves its second"
              echo "healthcheck pass to T+150s and re-asserts the redirect/410 fixture entries rather"
              echo "than sampling them. No flag to remember; the signal travels with the artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write RELEASE.json
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            fs.writeFileSync("dist/RELEASE.json", JSON.stringify({
              source_sha: process.env.GITHUB_SHA,
              target: process.env.TARGET,
              built_at: new Date().toISOString(),
              run_id: process.env.GITHUB_RUN_ID,
              file_count: Number(fs.readFileSync("/tmp/count","utf8").trim()),
              manifest_sha256: fs.readFileSync("/tmp/man.sha","utf8").trim(),
              htaccess_sha256: fs.readFileSync("/tmp/ht.sha","utf8").trim(),
              htaccess_changed: process.env.HT_CHANGED === "true",
            }, null, 1) + "\n");
          '
          cat dist/RELEASE.json
        env:
          HT_CHANGED: ${{ steps.r2.outputs.changed }}

      # A fresh repo per run, so the branch is always exactly one commit and never
      # accumulates history. Force-push to epik-release*, never to main.
      - name: Publish orphan release branch
        env:
          BRANCH: ${{ env.TARGET == 'staging' && 'epik-release-staging' || 'epik-release' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rel && cp -a dist /tmp/rel && cd /tmp/rel
          git init -q && git checkout -qb "$BRANCH"
          git add -Af
          git -c user.email=ci@tiereduptech.com -c user.name='prb-ci' \
              commit -qm "release ${GITHUB_SHA} (${TARGET})"
          git push --force -q \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" "$BRANCH"
          echo "published $BRANCH @ ${GITHUB_SHA}"

      # ── The site is the status channel ──────────────────────────────────────
      # With no inbound path, this is the observability answer: the box writes its
      # outcome into the live tree and CI reads it over HTTPS. A failed or
      # rolled-back deploy still turns CI red.
      #
      # NOTE this step runs on a PUSH event too: github.event.inputs.confirm is
      # '' there, and '' != 'false'. So once EPIK_PULL_AUTO_PUBLISH is on, every
      # qualifying commit polls. Unpinned in the pre-DNS window that is a
      # guaranteed ~20-minute red run per publish while the box is in fact green
      # — a red run that means nothing, arriving during the burn-in that is
      # supposed to build the confidence to move DNS. That is how an alarm gets
      # trained to be ignored, which is the same reasoning that defers the cron
      # entry until after the docroot flip.
      - name: Confirm the box went live
        if: github.event.inputs.confirm != 'false'
        env:
          SITE: ${{ env.TARGET == 'staging' && vars.EPIK_STAGING_URL || 'https://prorigbuilder.com' }}
          AUTH: ${{ env.TARGET == 'staging' && secrets.EPIK_STAGING_BASIC_AUTH || '' }}
          ORIGIN_IP: ${{ env.TARGET == 'production' && vars.EPIK_ORIGIN_IP || '' }}
        run: |
          set -uo pipefail
          HOST=${SITE#*://}; HOST=${HOST%%/*}; HOST=${HOST%%:*}
          ARGS=(-sS --max-time 20)
          [ -n "$AUTH" ] && ARGS+=(-u "$AUTH")
          if [ -n "$ORIGIN_IP" ]; then
            ARGS+=(--resolve "$HOST:443:$ORIGIN_IP" -k)
            WHERE="pinned: $HOST:443 -> $ORIGIN_IP (cert not validated)"
          else
            WHERE="whatever DNS resolves $HOST to"
          fi
          echo "polling $SITE/_deploy-status.json for $GITHUB_SHA (cron is */5, allow ~20 min)"
          echo "  going to: $WHERE"
          for i in $(seq 1 80); do
            BODY=$(curl "${ARGS[@]}" "$SITE/_deploy-status.json?t=${GITHUB_RUN_ID}.$i" 2>/dev/null || true)
            LIVE=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);process.stdout.write(`${o.live_sha}|${o.health}|${o.message||""}`)}catch(e){process.stdout.write("|")}})')
            SHA=${LIVE%%|*}; REST=${LIVE#*|}; HEALTH=${REST%%|*}; MSG=${REST#*|}
            if [ "$SHA" = "$GITHUB_SHA" ] && [ "$HEALTH" = "ok" ]; then
              echo "confirmed live after ~$((i*15))s"
              if [ "${{ steps.r2.outputs.changed }}" = "true" ]; then
                echo "::warning::reminder — .htaccess changed in this release; it went out on the settle path"
              fi
              exit 0
            fi
            [ -n "$HEALTH" ] && [ "$HEALTH" != "ok" ] && echo "  box reports health=$HEALTH ${MSG:+($MSG)}"
            sleep 15
          done
          # Say WHICH failure this is. Pinned, the request reached the box by
          # construction and the box really did not confirm. Unpinned, the same
          # evidence fits two readings and picking the alarming one is exactly the
          # error hc_verdict() exists to prevent (epik-pull.sh, "unverified").
          if [ -n "$ORIGIN_IP" ]; then
            echo "::error::the box never confirmed $GITHUB_SHA within ~20 min. The poll was pinned to $ORIGIN_IP, so it did reach this box — this is a real failure to confirm. Check cron mail and the watchdog."
          else
            echo "::error::no confirmation of $GITHUB_SHA within ~20 min — and this is NOT yet a verdict on the box."
            echo "The poll was NOT pinned, so two readings fit the same evidence:"
            echo "  a) the box never went live (or went live and rolled back), or"
            echo "  b) $HOST still answers from another stack and this poll never reached the box."
            echo "Set the EPIK_ORIGIN_IP repo variable to the origin IP and the answer is unambiguous."
            echo "(Clear it again once DNS points at the box.)"
          fi
          exit 1
