name: Freshness Gates

# Two assertions, one red light. Both answer "is this actually working?" rather
# than "does it look like it should be working?"
#
#   1. scripts/assert-retailer-freshness.cjs — every retailer in parts.js has
#      been confirmed against its retailer within a stated cadence, and the cron
#      responsible for confirming it is still live.
#
#   2. scripts/assert-workflow-outcomes.cjs — every workflow with a live cron has
#      actually SUCCEEDED within its cadence. Cancelled counts as not-succeeded.
#
# WHY BOTH, AND WHY SEPARATE FILES
#   Same mistake, three shapes: a dated price point read as evidence a retailer
#   was checked; a cron read as evidence a job succeeded; a green run read as
#   evidence something deployed. Gate 1 closed the first, and its provenance
#   layer closed the second only as far as "the cron exists". A cron is still a
#   proxy — sftp-ingest.yml had a daily cron, ran every day, and succeeded twice
#   in 99 runs while the Newegg feed wrote nothing for 95 days. Gate 2 reads the
#   conclusions.
#
#   They are separate scripts because gate 1 is pure and offline — it runs on a
#   laptop with no token — while gate 2 needs the Actions API. Folding them into
#   one file would make the offline gate require a credential.
#
# WHY NOT IN `npm test`
#   Both are expected to be RED right now. A known-red assertion in the shared
#   suite turns every unrelated PR red, and an always-red suite gets deleted or
#   `|| true`-d within a week — the same signal-with-no-consequence failure these
#   gates exist to replace. `test/retailer-freshness.test.js`,
#   `test/workflow-outcomes.test.js` and `test/sftp-ingest.streaming.test.js` are
#   the halves that belong in `npm test`: they prove the gates discriminate, are
#   hermetic, and stay green.
#
# WHY IT DOES NOT PUSH TO MAIN
#   Read-only by construction, so deliberately NOT in the `main-writer`
#   concurrency group; test/verify-main-writer-lock.cjs asserts only main-pushers
#   carry it.
#
# SCHEDULING
#   13:00 UTC, after every job that writes parts.js has had its slot for the day
#   (asin-identity-audit 03:00, prerender 06:00, price-history 07:00,
#   verify-catalog 08/09/10/11, sftp-ingest 12:00 + up to 3h).

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'src/data/parts.js'
      - 'src/data/parts/**'
      - 'scripts/assert-retailer-freshness.cjs'
      - 'scripts/assert-workflow-outcomes.cjs'
      - '.github/workflows/**'

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Gate 2 reads run conclusions via the Actions API.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm ci — both gates depend only on node builtins. Keeping them
      # dependency-free means a broken dependency tree can never be the reason
      # the alarm fails to run.

      # continue-on-error so gate 2 still reports when gate 1 is red. The final
      # step is what actually fails the job, using both outcomes.
      - name: 'Gate 1 — retailer confirmation freshness'
        id: retailer
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/assert-retailer-freshness.cjs | tee retailer-freshness.txt

      - name: 'Gate 2 — scheduled workflow outcomes'
        id: outcomes
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          node scripts/assert-workflow-outcomes.cjs | tee workflow-outcomes.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Freshness gates"
            echo ""
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Retailer confirmation freshness | ${{ steps.retailer.outcome }} |"
            echo "| Scheduled workflow outcomes | ${{ steps.outcomes.outcome }} |"
            echo ""
            echo "### Gate 1 — retailer confirmation freshness"
            echo '```'
            cat retailer-freshness.txt 2>/dev/null || echo "(gate crashed before reporting)"
            echo '```'
            echo ""
            echo "### Gate 2 — scheduled workflow outcomes"
            echo '```'
            cat workflow-outcomes.txt 2>/dev/null || echo "(gate crashed before reporting)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # pipefail above keeps `node | tee` from masking a non-zero exit; this step
      # is what turns either gate's failure into a failed job. Explicit rather
      # than relying on continue-on-error semantics, so the reason is readable.
      - name: Fail if either gate failed
        if: always()
        run: |
          R='${{ steps.retailer.outcome }}'
          O='${{ steps.outcomes.outcome }}'
          echo "gate 1 (retailer freshness): $R"
          echo "gate 2 (workflow outcomes):  $O"
          if [ "$R" != "success" ] || [ "$O" != "success" ]; then
            echo ""
            echo "A gate above is red. Something in the pipeline is publishing data nothing"
            echo "refreshes, or running on a schedule without ever completing. Fix the job,"
            echo "or drop the retailer / remove the cron. Those are the outcomes that pass."
            exit 1
          fi
