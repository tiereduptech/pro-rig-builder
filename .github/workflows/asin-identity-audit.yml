name: ASIN Identity Audit

# Continuous integrity check on every Amazon affiliate link in the catalog.
#
# Compares Amazon's OWN title for each linked ASIN against the stored catalog
# name, then:
#   - QUARANTINES dead ASINs automatically, but only after two consecutive runs
#     return nothing (a single API blip must never hide a live row)
#   - REPORTS wrong-product / close-but-wrong links to a review queue and NEVER
#     writes or relinks them — a wrong ASIN replaced by a guessed ASIN is the
#     same bug in a new coat
#   - ALERTS when the wrong-link attach rate jumps above its trailing median,
#     which is the signature of an ingest starting to mis-attach again
#
# COST / THROUGHPUT
#   ~3,600 unique ASINs / 10 per call = ~360 calls per run, one run per day,
#   paced at ~1 req/s (measured safe; throttling starts around a 6-call burst).
#   The Creators API exposes no quota headers, so the TPD ceiling is unconfirmed
#   — see TODO below. 360 calls/day sits far under the historical PA-API v5
#   baseline of 8,640/day, so the pacing here is deliberately set low enough
#   that the unknown ceiling cannot matter. Do not raise the frequency or drop
#   PAUSE_MS without confirming the real limit in the Associates portal first.
#
#   TODO(coby): confirm TPD ceiling in the Associates portal and record it here.
#
# SCHEDULING
#   03:00 UTC deliberately avoids prerender.yml (06:00) and every
#   verify-catalog.yml tier (08:00/09:00/10:00/11:00), all of which also push to
#   main. The push step below uses the same stash + rebase + retry pattern as
#   verify-catalog.yml so a collision degrades to a retry rather than a clobber.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Quarantine confirmed-dead ASINs (uncheck for a dry run)'
        required: false
        default: true
        type: boolean
      alert_jump_pp:
        description: 'Alert when attach-defect rate rises this many points above trailing median'
        required: false
        default: '2.0'
        type: string

concurrency:
  # Never let two audits — or an audit and its own retry — race on parts.js.
  group: asin-identity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ASIN identity audit
        id: audit
        env:
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: |
          APPLY="--apply"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply }}" != "true" ]; then
            APPLY=""
            echo "Dry run — no quarantine writes"
          fi
          JUMP="${{ github.event.inputs.alert_jump_pp }}"
          [ -z "$JUMP" ] && JUMP="2.0"
          node amazon-asin-identity-audit.mjs --nightly $APPLY --alert-jump=$JUMP

      # The frontend loads src/data/parts/<cat>.js, not the barrel, so the chunks
      # must be re-emitted before change detection or quarantines never surface.
      - name: Re-split catalog into per-category chunks
        run: node scripts/split-parts-by-cat.cjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/parts.js src/data/parts/ amazon-asin-audit-state.json relink-review-queue.json amazon-asin-identity-audit.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat src/data/parts.js src/data/parts/ amazon-asin-audit-state.json relink-review-queue.json amazon-asin-identity-audit.json
          fi

      - name: Commit and push (with rebase retry)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="src/data/parts.js src/data/parts/ amazon-asin-audit-state.json relink-review-queue.json amazon-asin-identity-audit.json"

          git stash push -m "asin-audit" -- $FILES

          for i in 1 2 3; do
            echo "Push attempt $i/3"
            git pull --rebase origin main || { echo "rebase failed"; exit 1; }
            git stash pop || { echo "stash pop failed - conflicting changes on main"; exit 1; }

            git add $FILES
            git commit -m "chore(audit): nightly ASIN identity audit

          Quarantined ${{ steps.audit.outputs.quarantined }} confirmed-dead ASINs (two-strike rule).
          ${{ steps.audit.outputs.queue }} rows queued for human relink review (not written).
          Attach-defect rate: ${{ steps.audit.outputs.attach_rate }}%"

            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            else
              echo "Push rejected, retrying..."
              git reset HEAD~1
              git stash push -m "asin-audit" -- $FILES
              sleep 5
            fi
          done

          echo "All push attempts failed"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ASIN Identity Audit"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Dead ASINs quarantined | ${{ steps.audit.outputs.quarantined }} |"
            echo "| Queued for human review | ${{ steps.audit.outputs.queue }} |"
            echo "| Attach-defect rate | ${{ steps.audit.outputs.attach_rate }}% |"
            echo "| Jump vs trailing median | ${{ steps.audit.outputs.jump }} pp |"
            echo "| Degraded run | ${{ steps.audit.outputs.degraded }} |"
            echo "| Alert | ${{ steps.audit.outputs.alert }} |"
            echo ""
            echo "Wrong-product links are reported only — never auto-relinked."
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail on attach-rate alert
        if: steps.audit.outputs.alert == 'true'
        run: |
          echo "::warning::Attach-defect rate rose ${{ steps.audit.outputs.jump }}pp above trailing median — an ingest may be attaching bad links again."
          echo "Investigate recent ingests before this compounds."
          exit 1
